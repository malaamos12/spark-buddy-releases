 time.Second})\n\tif e == nil {\n\t\tt.Fatal("unsafe bootstrap accepted")\n\t}\n}\n\nfunc TestForcedBootstrapDataRestoreRecovery(t *testing.T) {\n\tfor _, phase := range []string{"bootstrap-before-archive-rename", "bootstrap-data-preserved", "bootstrap-data-restored"} {\n\t\tt.Run(phase, func(t *testing.T) {\n\t\t\tt.Setenv("BUDDY_CANDIDATE_FIXTURE", "1")\n\t\t\tt.Setenv("BUDDY_CANDIDATE_BAD_HEALTH", "1")\n\t\t\tc, _, old := candidateTree(t)\n\t\t\told.Process.Kill()\n\t\t\told.Wait()\n\t\t\tdata := filepath.Join(t.TempDir(), "data")\n\t\t\tos.Mkdir(data, 0700)\n\t\t\tstate := []byte(`{"version":1,"settings":{},"tasks":[],"reminders":[]}`)\n\t\t\tos.WriteFile(filepath.Join(data, "state.json"), state, 0600)\n\t\t\tos.WriteFile(filepath.Join(data, "sidekick-key.enc"), []byte("opaque"), 0600)\n\t\t\tt.Setenv("BUDDY_FIXTURE_MUTATE_DATA", data)\n\t\t\tparent := t.TempDir()\n\t\t\tconfig := BootstrapConfig{Root: c.Root, Data: data, BackupParent: parent, Session: Token(), OldHash: sha([]byte("old")), NewHash: sha([]byte("new")), HelperHash: sha([]byte("helper")), Payload: []byte("new"), Helper: []byte("helper"), Timeout: 5 * time.Second}\n\t\t\tb, _ := json.Marshal(config)\n\t\t\tcf := filepath.Join(parent, "config.json")\n\t\t\tos.WriteFile(cf, b, 0600)\n\t\t\tbin, _ := os.Executable()\n\t\t\tchild := exec.Command(bin)\n\t\t\tchild.Env = append(os.Environ(), "BUDDY_BOOTSTRAP_KILL=1", "BUDDY_KILL_CONFIG="+cf, "BUDDY_KILL_PHASE="+phase)\n\t\t\tif e := child.Start(); e != nil {\n\t\t\t\tt.Fatal(e)\n\t\t\t}\n\t\t\tdefer func() { child.Process.Kill(); child.Wait() }()\n\t\t\tend := time.Now().Add(8 * time.Second)\n\t\t\tfor {\n\t\t\t\tif _, e := os.Stat(filepath.Join(parent, "checkpoint")); e == nil {\n\t\t\t\t\tbreak\n\t\t\t\t}\n\t\t\t\tif time.Now().After(end) {\n\t\t\t\t\tt.Fatal("no bootstrap checkpoint")\n\t\t\t\t}\n\t\t\t\ttime.Sleep(10 * time.Millisecond)\n\t\t\t}\n\t\t\tchild.Process.Kill()\n\t\t\tchild.Wait()\n\t\t\tif e := RecoverBootstrap(config, filepath.Join(parent, config.Session)); e != nil {\n\t\t\t\tt.Fatal(e)\n\t\t\t}\n\t\t\tb, _ = os.ReadFile(filepath.Join(data, "state.json"))\n\t\t\tif string(b) != string(state) {\n\t\t\t\tt.Fatal("data not restored")\n\t\t\t}\n\t\t\tb, _ = os.ReadFile(filepath.Join(c.Root, "resources", "app.asar"))\n\t\t\tif string(b) != "old" {\n\t\t\t\tt.Fatal("app not restored")\n\t\t\t}\n\t\t})\n\t}\n}\n\nfunc TestRuntimeIdentityRejectsUnknown(t *testing.T) {\n\tp := filepath.Join(t.TempDir(), "Spark Buddy.exe")\n\tos.WriteFile(p, []byte("not runtime"), 0600)\n\tif validateRuntime(p) == nil {\n\t\tt.Fatal("unknown runtime accepted")\n\t}\n}\nfunc TestSnapshotRestrictedACL(t *testing.T) {\n\tp := filepath.Join(t.TempDir(), "private")\n\tif e := restrictedDirectory(p); e != nil {\n\t\tt.Fatal(e)\n\t}\n\tscript := `$a=Get-Acl -LiteralPath $env:BUDDY_ACL_PATH; if(-not $a.AreAccessRulesProtected){exit 2};$sid=[System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value;foreach($r in $a.Access){if($r.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value -ne $sid){exit 3};if($r.IsInherited){exit 4}};if($a.Access.Count -lt 1){exit 5}`\n\tcmd := exec.Command("powershell.exe", "-NoProfile", "-NonInteractive", "-Command", script)\n\tcmd.Env = append(os.Environ(), "BUDDY_ACL_PATH="+p)\n\tif b, e := cmd.CombinedOutput(); e != nil {\n\t\tt.Fatalf("ACL assertion failed: %v (%d bytes)", e, len(b))\n\t}\n}\n', encoding='utf-8')
