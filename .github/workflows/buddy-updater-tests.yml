          (root / 'backup.go').write_text('package updater\n\nimport (\n\t"encoding/json"\n\t"errors"\n\t"os"\n\t"path/filepath"\n\t"sort"\n\t"strings"\n)\n\ntype SnapshotEntry struct {\n\tPath, Hash string\n\tBytes      int64\n}\ntype SnapshotManifest struct {\n\tFiles       []SnapshotEntry\n\tDirectories []string\n}\n\n// Snapshot includes all regular files, including opaque encrypted files. It never decrypts them.\n// Caller stops Buddy first and creates a restricted parent outside the data tree.\nfunc Snapshot(source, dest string) (SnapshotManifest, error) {\n\tvar m SnapshotManifest\n\tif !filepath.IsAbs(source) || !filepath.IsAbs(dest) {\n\t\treturn m, errors.New("absolute snapshot paths required")\n\t}\n\tif e := safePath(source); e != nil {\n\t\treturn m, e\n\t}\n\trel, e := filepath.Rel(source, dest)\n\tif e != nil || rel == "." || (!filepath.IsAbs(rel) && rel != ".." && !strings.HasPrefix(rel, ".."+string(filepath.Separator))) {\n\t\treturn m, errors.New("snapshot must be outside source")\n\t}\n\tif e = restrictedDirectory(dest); e != nil {\n\t\treturn m, e\n\t}\n\te = filepath.WalkDir(source, func(p string, d os.DirEntry, e error) error {\n\t\tif e != nil {\n\t\t\treturn e\n\t\t}\n\t\tif e = safePath(p); e != nil {\n\t\t\treturn e\n\t\t}\n\t\tr, e := filepath.Rel(source, p)\n\t\tif e != nil {\n\t\t\treturn e\n\t\t}\n\t\tif r == "." {\n\t\t\treturn nil\n\t\t}\n\t\ttarget := filepath.Join(dest, r)\n\t\tif d.IsDir() {\n\t\t\tm.Directories = append(m.Directories, r)\n\t\t\treturn os.Mkdir(target, 0700)\n\t\t}\n\t\tif e = regular(p); e != nil {\n\t\t\treturn e\n\t\t}\n\t\tbefore, e := hashFile(p)\n\t\tif e != nil {\n\t\t\treturn e\n\t\t}\n\t\tif e = copyExclusive(p, target); e != nil {\n\t\t\treturn e\n\t\t}\n\t\tafter, e := hashFile(p)\n\t\tif e != nil || after != before {\n\t\t\treturn errors.New("data changed during backup")\n\t\t}\n\t\tcopied, e := hashFile(target)\n\t\tif e != nil || copied != before {\n\t\t\treturn errors.New("backup verification failed")\n\t\t}\n\t\ts, e := os.Stat(p)\n\t\tif e != nil {\n\t\t\treturn e\n\t\t}\n\t\tm.Files = append(m.Files, SnapshotEntry{r, before, s.Size()})\n\t\treturn nil\n\t})\n\tif e != nil {\n\t\treturn m, e\n\t}\n\tsort.Slice(m.Files, func(i, j int) bool { return m.Files[i].Path < m.Files[j].Path })\n\treturn m, VerifySnapshot(dest, m)\n}\nfunc VerifySnapshot(root string, m SnapshotManifest) error {\n\texpected := map[string]SnapshotEntry{}\n\tdirs := map[string]bool{}\n\tfor _, d := range m.Directories {\n\t\tdirs[d] = true\n\t}\n\tfor _, f := range m.Files {\n\t\tif filepath.IsAbs(f.Path) || filepath.Clean(f.Path) == ".." {\n\t\t\treturn errors.New("bad snapshot path")\n\t\t}\n\t\texpected[f.Path] = f\n\t}\n\tcount := 0\n\tdirectoryCount := 0\n\te := filepath.WalkDir(root, func(p string, d os.DirEntry, e error) error {\n\t\tif e != nil {\n\t\t\treturn e\n\t\t}\n\t\tif e = safePath(p); e != nil {\n\t\t\treturn e\n\t\t}\n\t\tr, e := filepath.Rel(root, p)\n\t\tif e != nil {\n\t\t\treturn e\n\t\t}\n\t\tif r == "." {\n\t\t\treturn nil\n\t\t}\n\t\tif d.IsDir() {\n\t\t\tif !dirs[r] {\n\t\t\t\treturn errors.New("unexpected backup directory")\n\t\t\t}\n\t\t\tdirectoryCount++\n\t\t\treturn nil\n\t\t}\n\t\tf, ok := expected[r]\n\t\tif !ok {\n\t\t\treturn errors.New("unexpected backup file")\n\t\t}\n\t\tif e = regular(p); e != nil {\n\t\t\treturn e\n\t\t}\n\t\th, e := hashFile(p)\n\t\tif e != nil || h != f.Hash {\n\t\t\treturn errors.New("snapshot hash mismatch")\n\t\t}\n\t\ts, e := os.Stat(p)\n\t\tif e != nil || s.Size() != f.Bytes {\n\t\t\treturn errors.New("snapshot size mismatch")\n\t\t}\n\t\tcount++\n\t\treturn nil\n\t})\n\tif e != nil {\n\t\treturn e\n\t}\n\tif count != len(m.Files) || directoryCount != len(m.Directories) {\n\t\treturn errors.New("incomplete snapshot")\n\t}\n\treturn nil\n}\nfunc WriteSnapshotManifest(p string, m SnapshotManifest) error {\n\tb, e := json.Marshal(m)\n\tif e != nil {\n\t\treturn e\n\t}\n\tf, e := os.OpenFile(p, os.O_CREATE|os.O_EXCL|os.O_WRONLY, 0600)\n\tif e != nil {\n\t\treturn e\n\t}\n\t_, e = f.Write(b)\n\tif e == nil {\n\t\te = f.Sync()\n\t}\n\tc := f.Close()\n\tif e != nil {\n\t\treturn e\n\t}\n\treturn c\n}\n', encoding='utf-8')
