d/v4.1.0/update.json\',path.join(work,\'update.json\'));\n // Integrate only the small health module into an isolated copy downloaded in CI.\n // The broader Buddy source is never committed or logged. Test key is ephemeral.\n const asar=await import(\'@electron/asar\');const unpack=path.join(process.cwd(),\'candidate-app\');asar.extractAll(path.join(work,\'next.asar\'),unpack);\n const mainFile=path.join(unpack,\'main.js\');let main=fs.readFileSync(mainFile,\'utf8\');const anchor="if(process.argv.includes(\'--update-health\'))panel.webContents.once";assert(main.includes(anchor),\'health integration anchor missing\');main=main.replace(anchor,"require(\'./session-health.cjs\').bindHealth(app,panel);"+anchor);fs.writeFileSync(mainFile,main);fs.copyFileSync(path.join(process.cwd(),\'session-health.cjs\'),path.join(unpack,\'session-health.cjs\'));fs.unlinkSync(path.join(work,\'next.asar\'));await asar.createPackage(unpack,path.join(work,\'next.asar\'));\n const keys=crypto.generateKeyPairSync(\'ed25519\');const der=keys.publicKey.export({type:\'spki\',format:\'der\'});const pub=\'-----BEGIN PUBLIC KEY-----\\n\'+der.toString(\'base64\')+\'\\n-----END PUBLIC KEY-----\\n\';const pemFile=path.join(process.cwd(),\'test-key-public.txt\');fs.writeFileSync(pemFile,pub);\n const payload=JSON.stringify({version:\'4.1.0\',sha256:crypto.createHash(\'sha256\').update(fs.readFileSync(path.join(work,\'next.asar\'))).digest(\'hex\'),bytes:fs.statSync(path.join(work,\'next.asar\')).size,url:\'https://github.com/malaamos12/spark-buddy-releases/releases/download/v4.1.0/app.asar\',kind:\'asar\',runtime:\'45.4.1\'});fs.writeFileSync(path.join(work,\'update.json\'),JSON.stringify({payload,signature:crypto.sign(null,Buffer.from(payload),keys.privateKey).toString(\'base64\')}));\n cp.execFileSync(\'go\',[\'build\',\'-ldflags\',\'-X main.testPublicKeyB64=\'+Buffer.from(pub).toString(\'base64\'),\'-o\',\'buddy-helper-test-key.exe\',\'./cmd/buddy-helper\'],{stdio:\'inherit\'});\n const {_electron}=require(\'playwright-core\');const old=await _electron.launch({executablePath:exe,args:[],cwd:root,env:{...process.env,SPARK_TEST_DATA:data},timeout:45000});assert.equal(await old.evaluate(({app})=>app.getVersion()),\'4.0.2\');const pid=await old.evaluate(()=>process.pid),helper=path.join(process.cwd(),\'buddy-helper-test-key.exe\'),identity=cp.execFileSync(helper,[\'-identify\',String(pid)],{encoding:\'utf8\'}).trim(),session=crypto.randomBytes(24).toString(\'hex\');\n // Real published Buddy emits legacy health. Adapter maps it only after verifying\n // the restarted process version and data location. It is NOT shipped app code.\n const env={...process.env,SPARK_TEST_DATA:data};const h=cp.spawn(helper,[\'-root\',root,\'-work\',work,\'-session\',session,\'-old-pid\',String(pid),\'-old-identity\',identity,\'-current\',\'4.0.2\',\'-timeout\',\'20s\'],{env,stdio:[\'ignore\',\'pipe\',\'pipe\']});let output=\'\';h.stdout.on(\'data\',b=>output+=b);h.stderr.on(\'data\',b=>output+=b);const done=new Promise(resolve=>h.once(\'exit\',resolve));\n console.log(\'Helper started, waiting for ready\');await wait(()=>fs.existsSync(path.join(work,\'ready-\'+session))).catch(e=>{console.log(\'helper-output\',output);for(const n of fs.readdirSync(work)){if(n.endsWith(\'.log\')||n===\'active.json\')console.log(n,fs.readFileSync(path.join(work,n),\'utf8\'))}throw Error(\'ready timeout\')});console.log(\'Helper ready\');fs.writeFileSync(path.join(work,\'approve-\'+session),session);await old.close();\n const ack=path.join(data,\'updates\',\'healthy.txt\');console.log(\'Old app closed; waiting for actual health\');await wait(()=>fs.existsSync(ack)).catch(e=>{console.log(\'helper-output\',output);for(const n of fs.readdirSync(work)){if(n.endsWith(\'.log\')||n===\'active.json\')console.log(n,fs.readFileSync(path.join(work,n),\'utf8\'))}throw Error(\'actual health timeout\')});assert(fs.readFileSync(ack,\'utf8\').includes(\'4.1.0\'));await wait(()=>fs.existsSync(path.join(work,\'health-\'+session)));assert.equal(fs.readFileSync(path.join(work,\'health-\'+session),\'utf8\'),session+\' 4.1.0\');assert.equal(await done,0,output);assert.equal(JSON.parse(fs.readFileSync(path.join(work,\'active.json\'))).Phase,\'healthy\');\n console.log(\'PASS exact standalone helper.exe verified signed manifest, waited readiness/approval/old exit, replaced published archive and relaunched real Buddy with actual legacy startup health. Exact app-side session health module used, no harness health adapter. Modified isolated payload and helper use ephemeral test key, not release key.\');\n // Disposable CI job cleanup ends this isolated fixture process.\n})().then(()=>process.exit(0)).catch(e=>{console.error(e.message);process.exit(1)});\n', encoding='utf-8')
