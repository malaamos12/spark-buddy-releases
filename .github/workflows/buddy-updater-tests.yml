e != nil {\n\t\treturn e\n\t}\n\tif i != identity || !os.SameFile(actual, expected) {\n\t\treturn errors.New("old process identity/path mismatch")\n\t}\n\treturn nil\n}\nfunc processAlive(pid int, identity string) bool {\n\ti, _, e := processInfo(pid)\n\treturn e == nil && i == identity\n}\n', encoding='utf-8')
