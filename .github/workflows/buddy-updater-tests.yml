          (root / 'session-install.cjs').write_text("// Buddy app-side handshake candidate. No download or key/provider access.\nconst fs=require('original-fs'),path=require('path'),crypto=require('crypto'),{spawn,execFile}=require('child_process');\nfunction identify(helper,pid){return new Promise((resolve,reject)=>execFile(helper,['-identify',String(pid)],{windowsHide:true,timeout:5000},(e,out)=>e?reject(Error('Helper identity check failed')):resolve(out.trim())))}\nasync function installPrepared(app,dialog,{helper,root,work,current}){\n const choice=await dialog.showMessageBox({type:'question',buttons:['Cancel','Install verified update'],defaultId:0,cancelId:0,noLink:true,title:'Spark Buddy update',message:'Install the prepared Buddy update?',detail:'Buddy will close only after the helper verifies the update and confirms it is ready. The current app archive is kept for recovery. Tasks and keys are not uploaded. If startup fails, the helper restores the old archive. This development candidate is not approved for device delivery.'});\n if(choice.response!==1)return {status:'cancelled'};\n const session=crypto.randomBytes(24).toString('hex'),identity=await identify(helper,process.pid);\n // Persist pending state before helper launch. One transaction work directory per update.\n const child=spawn(helper,['-root',root,'-work',work,'-session',session,'-old-pid',String(process.pid),'-old-identity',identity,'-current',current,'-timeout','45s'],{detached:true,stdio:['ignore','ignore','pipe'],windowsHide:true});\n let diagnostic='';child.stderr.on('data',b=>diagnostic+=b.toString());let failed=false;child.once('error',()=>failed=true);child.once('exit',()=>failed=true);\n const ready=path.join(work,'ready-'+session),end=Date.now()+10000;\n while(Date.now()<end&&!failed){if(fs.existsSync(ready)){\n  const report=JSON.parse(fs.readFileSync(ready,'utf8'));if(report.session!==session)throw Error('Wrong helper readiness session');\n  const approval=path.join(work,'approve-'+session);const fd=fs.openSync(approval,'wx',0o600);try{fs.writeFileSync(fd,session);fs.fsyncSync(fd)}finally{fs.closeSync(fd)}\n  child.unref();app.quit();return {status:'installing'};\n }await new Promise(r=>setTimeout(r,50))}\n throw Error('Helper did not confirm readiness. Buddy was left open. No app archive was replaced. '+diagnostic);\n}\nmodule.exports={installPrepared};\n", encoding='utf-8')
