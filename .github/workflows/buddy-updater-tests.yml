          (root / 'session-health.cjs').write_text("// Small Buddy helper integration module. No app state or provider access.\nconst fs=require('original-fs'),path=require('path');\nfunction bindHealth(app,panel){\n if(!process.argv.includes('--update-health'))return false;\n const token=process.env.BUDDY_UPDATE_SESSION,work=process.env.BUDDY_UPDATE_WORK;\n if(!/^[a-f0-9]{48}$/.test(token||'')||!work||!path.isAbsolute(work))return false;\n // Work must be an existing directory without reparse/symlink components.\n for(let p=path.resolve(work);;p=path.dirname(p)){\n  const s=fs.lstatSync(p);if(s.isSymbolicLink())throw Error('Health directory link rejected');\n  if(path.dirname(p)===p)break;\n }\n const target=path.join(work,'health-'+token),pending=target+'.new';\n const write=()=>setTimeout(()=>{\n  if(panel.isDestroyed()||panel.webContents.isDestroyed()||panel.webContents.isLoadingMainFrame())return;\n  // Exclusive create refuses replay/collision. Helper consumes exact token+version.\n  const fd=fs.openSync(pending,'wx',0o600);try{fs.writeFileSync(fd,token+' '+app.getVersion());fs.fsyncSync(fd)}finally{fs.closeSync(fd)}\n  if(fs.existsSync(target)){fs.unlinkSync(pending);return}\n  fs.renameSync(pending,target);\n },3000);\n panel.webContents.once('did-finish-load',write);return true;\n}\nmodule.exports={bindHealth};\n", encoding='utf-8')
