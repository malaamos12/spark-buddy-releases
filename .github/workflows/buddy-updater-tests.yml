          (root / 'platform_other.go').write_text('//go:build !windows\n\npackage updater\n\nimport (\n\t"crypto/sha256"\n\t"errors"\n\t"os/exec"\n)\n\nfunc sum256(b []byte) [32]byte                   { return sha256.Sum256(b) }\nfunc safePath(p string) error                    { return errors.New("Windows candidate only") }\nfunc Identity(pid int) (string, error)           { return "", errors.New("Windows only") }\nfunc matchingProcess(pid int, i, p string) error { return errors.New("Windows only") }\nfunc processAlive(pid int, i string) bool        { return false }\n\nfunc transactionLock(p string) (func(), error) { return nil, errors.New("Windows only") }\nfunc noBuddyProcesses(p string) error          { return errors.New("Windows only") }\nfunc restrictedDirectory(p string) error       { return errors.New("Windows only") }\nfunc availableSpace(p string, n int64) error   { return errors.New("Windows only") }\nfunc stopOwnedProcess(cmd *exec.Cmd) error     { return errors.New("Windows only") }\n\nfunc availableSpaceOn(data, target string, n int64) error { return errors.New("Windows only") }\n\nfunc validateRuntime(p string) error { return errors.New("Windows only") }\n', encoding='utf-8')
          (root / 'engine_windows_test.go').parent.mkdir(parents=True, exist_ok=True)
          (root / 'engine_windows_test.go').write_text('//go:build windows\n\npackage updater\n\nimport (\n\t"crypto/ed25519"\n\t"crypto/rand"\n\t"encoding/base64"\n\t"encoding/json"\n\t"os"\n\t"os/exec"\n\t"path/filepath"\n\t"testing"\n\t"time"\n)\n\nfunc TestMain(m *testing.M) {\n\tif os.Getenv("BUDDY_BOOTSTRAP_KILL") == "1" {\n\t\tallowFixtureRuntime = true\n\t\tvar c BootstrapConfig\n\t\tb, _ := os.ReadFile(os.Getenv("BUDDY_KILL_CONFIG"))\n\t\tjson.Unmarshal(b, &c)\n\t\ttestCheckpoint = func(phase string) {\n\t\t\tif phase == os.Getenv("BUDDY_KILL_PHASE") {\n\t\t\t\tos.WriteFile(filepath.Join(c.BackupParent, "checkpoint"), []byte(phase), 0600)\n\t\t\t\tfor {\n\t\t\t\t\ttime.Sleep(time.Second)\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t\tBootstrap(c)\n\t\tos.Exit(0)\n\t}\n\n\tif os.Getenv("BUDDY_KILL_ENGINE") == "1" {\n\t\tvar config struct {\n\t\t\tC Config\n\t\t\tK []byte\n\t\t}\n\t\tb, _ := os.ReadFile(os.Getenv("BUDDY_KILL_CONFIG"))\n\t\tjson.Unmarshal(b, &config)\n\t\ttestCheckpoint = func(phase string) {\n\t\t\tif phase == os.Getenv("BUDDY_KILL_PHASE") {\n\t\t\t\tos.WriteFile(filepath.Join(config.C.Work, "checkpoint"), []byte(phase), 0600)\n\t\t\t\tfor {\n\t\t\t\t\ttime.Sleep(time.Second)\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t\tif RunCandidate(config.C, ed25519.PublicKey(config.K)) != nil {\n\t\t\tos.Exit(2)\n\t\t}\n\t\tos.Exit(0)\n\t}\n\n\tif os.Getenv("BUDDY_CANDIDATE_FIXTURE") == "1" {\n\t\tTestCandidateChild(nil)\n\t}\n\tos.Exit(m.Run())\n}\nfunc TestCandidateChild(t *testing.T) {\n\tif os.Getenv("BUDDY_CANDIDATE_FIXTURE") != "1" {\n\t\treturn\n\t}\n\tif os.Getenv("BUDDY_UPDATE_SESSION") != "" {\n\t\tif data := os.Getenv("BUDDY_FIXTURE_MUTATE_DATA"); data != "" {\n\t\t\tos.WriteFile(filepath.Join(data, "state.json"), []byte("post-update changed state"), 0600)\n\t\t\tos.WriteFile(filepath.Join(data, "sidekick-key.enc"), []byte("post-update changed opaque key"), 0600)\n\t\t\tos.WriteFile(filepath.Join(data, "new-file"), []byte("post-update extra"), 0600)\n\t\t}\n\t\tif os.Getenv("BUDDY_CANDIDATE_BAD_HEALTH") != "1" {\n\t\t\tos.WriteFile(filepath.Join(os.Getenv("BUDDY_UPDATE_WORK"), "health-"+os.Getenv("BUDDY_UPDATE_SESSION")), []byte(os.Getenv("BUDDY_UPDATE_SESSION")+" 4.1.1"), 0600)\n\t\t}\n\t\ttime.Sleep(300 * time.Millisecond)\n\t} else {\n\t\ttime.Sleep(10 * time.Second)\n\t}\n\tos.Exit(0)\n}\nfunc candidateTree(t *testing.T) (Config, ed25519.PublicKey, *exec.Cmd) {\n\tt.Helper()\n\tr := filepath.Join(t.TempDir(), "Buddy\'s candidate عربي")\n\tw := filepath.Join(t.TempDir(), "stage")\n\tos.MkdirAll(filepath.Join(r, "resources"), 0700)\n\tos.Mkdir(w, 0700)\n\tbin, e := os.Executable()\n\tif e != nil {\n\t\tt.Fatal(e)\n\t}\n\tb, e := os.ReadFile(bin)\n\tif e != nil {\n\t\tt.Fatal(e)\n\t}\n\texe := filepath.Join(r, "Spark Buddy.exe")\n\tif e = os.WriteFile(exe, b, 0700); e != nil {\n\t\tt.Fatal(e)\n\t}\n\tos.WriteFile(filepath.Join(r, "resources", "app.asar"), []byte("old"), 0600)\n\tos.WriteFile(filepath.Join(w, "next.asar"), []byte("new"), 0600)\n\tpub, priv, _ := ed25519.GenerateKey(rand.Reader)\n\tm := Manifest{Version: "4.1.1", SHA256: sha([]byte("new")), Bytes: 3, URL: "https://github.com/malaamos12/spark-buddy-releases/releases/download/v4.1.1/app.asar", Kind: "asar", Runtime: "45.4.1"}\n\tp, _ := json.Marshal(m)\n\tenv, _ := json.Marshal(Envelope{string(p), base64.StdEncoding.EncodeToString(ed25519.Sign(priv, p))})\n\tos.WriteFile(filepath.Join(w, "update.json"), env, 0600)\n\told := exec.Command(exe, "-test.run=^TestCandidateChild$")\n\told.Dir = r\n\told.Env = append(os.Environ(), "BUDDY_CANDIDATE_FIXTURE=1")\n\tif e = old.Start(); e != nil {\n\t\tt.Fatal(e)\n\t}\n\tt.Cleanup(func() { old.Process.Kill(); old.Wait() })\n\ti, e := Identity(old.Process.Pid)\n\tif e != nil {\n\t\tt.Fatal(e)\n\t}\n\treturn Config{r, w, old.Process.Pid, i, Token(), "4.0.2", "45.4.1", 2 * time.Second}, pub, old\n}\nfunc awaitReady(t *testing.T, c Config, done <-chan error) {\n\tt.Helper()\n\tend := time.Now().Add(5 * time.Second)\n\tfor time.Now().Before(end) {\n\t\tif _, e := os.Stat(filepath.Join(c.Work, "ready-"+c.Session)); e == nil {\n\t\t\treturn\n\t\t}\n\t\tselect {\n\t\tcase e := <-done:\n\t\t\tt.Fatalf("helper stopped before ready: %v", e)\n\t\tdefault:\n\t\t}\n\t\ttime.Sleep(10 * time.Millisecond)\n\t}\n\tt.Fatal("ready missing")\n}\nfunc TestExactCandidateSuccess(t *testing.T) {\n\tt.Setenv("BUDDY_CANDIDATE_FIXTURE", "1")\n\tc, pub, old := candidateTree(t)\n\tdone := make(chan error, 1)\n\tgo func() { done <- RunCandidate(c, pub) }()\n\tawaitReady(t, c, done)\n\tos.WriteFile(filepath.Join(c.Work, "approve-"+c.Session), []byte(c.Session), 0600)\n\told.Process.Kill()\n\tif e := <-done; e != nil {\n\t\tt.Fatal(e)\n\t}\n\ttime.Sleep(400 * time.Millisecond)\n\tb, _ := os.ReadFile(filepath.Join(c.Root, "resources", "app.asar"))\n\tif string(b) != "new" {\n\t\tt.Fatal("live wrong")\n\t}\n\tb, _ = os.ReadFile(filepath.Join(c.Root, "resources", "app.asar.backup-"+c.Session))\n\tif string(b) != "old" {\n\t\tt.Fatal("backup wrong")\n\t}\n}\nfunc TestExactCandidateHealthRollback(t *testing.T) {\n\tt.Setenv("BUDDY_CANDIDATE_FIXTURE", "1")\n\tt.Setenv("BUDDY_CANDIDATE_BAD_HEALTH", "1")\n\tc, pub, old := candidateTree(t)\n\tdone := make(chan error, 1)\n\tgo func() { done <- RunCandidate(c, pub) }()\n\tawaitReady(t, c, done)\n\tos.WriteFile(filepath.Join(c.Work, "approve-"+c.Session), []byte(c.Session), 0600)\n\told.Process.Kill()\n\tif e := <-done; e == nil {\n\t\tt.Fatal("unhealthy accepted")\n\t}\n\tb, _ := os.ReadFile(filepath.Join(c.Root, "resources", "app.asar"))\n\tif string(b) != "old" {\n\t\tt.Fatal("old not restored")\n\t}\n}\nfunc TestExactCandidateNoApproval(t *testing.T) {\n\tc, pub, _ := candidateTree(t)\n\tif RunCandidate(c, pub) == nil {\n\t\tt.Fatal("ran without approval")\n\t}\n\tb, _ := os.ReadFile(filepath.Join(c.Root, "resources", "app.asar"))\n\tif string(b) != "old" {\n\t\tt.Fatal("changed before approval")\n\t}\n}\nfunc TestExactCandidateWrongIdentity(t *testing.T) {\n\tc, pub, _ := candidateTree(t)\n\tc.OldIdentity = "wrong"\n\tif RunCandidate(c, pub) == nil {\n\t\tt.Fatal("accepted wrong identity")\n\t}\n}\n\nfunc TestInterruptedRecoveryStates(t *testing.T) {\n\tfor _, phase := range []string{"backing-up", "installing", "launching", "rolling-back"} {\n\t\tfor _, liveState := range []string{"absent", "new"} {\n\t\t\tt.Run(phase+"/"+liveState, func(t *testing.T) {\n\t\t\t\tc, _, old := candidateTree(t)\n\t\t\t\told.Process.Kill()\n\t\t\t\told.Wait()\n\t\t\t\tlive := filepath.Join(c.Root, "resources", "app.asar")\n\t\t\t\tbackup := live + ".backup-" + c.Session\n\t\t\t\tif e := os.Rename(live, backup); e != nil {\n\t\t\t\t\tt.Fatal(e)\n\t\t\t\t}\n\t\t\t\tif liveState == "new" {\n\t\t\t\t\tos.WriteFile(live, []byte("new"), 0600)\n\t\t\t\t}\n\t\t\t\tif e := atomic(filepath.Join(c.Work, "active.json"), Journal{c.Session, phase, sha([]byte("old")), sha([]byte("new"))}); e != nil {\n\t\t\t\t\tt.Fatal(e)\n\t\t\t\t}\n\t\t\t\tif e := Recover(c.Root, c.Work); e != nil {\n\t\t\t\t\tt.Fatal(e)\n\t\t\t\t}\n\t\t\t\tb, _ := os.ReadFile(live)\n\t\t\t\tif string(b) != "old" {\n\t\t\t\t\tt.Fatal("old not recovered")\n\t\t\t\t}\n\t\t\t})\n\t\t}\n\t}\n}\nfunc TestRecoveryRefusesUnknownLiveOrHealthy(t *testing.T) {\n\tfor _, kind := range []string{"unknown", "healthy", "corrupt-backup"} {\n\t\tt.Run(kind, func(t *testing.T) {\n\t\t\tc, _, old := candidateTree(t)\n\t\t\told.Process.Kill()\n\t\t\told.Wait()\n\t\t\tlive := filepath.Join(c.Root, "resources", "app.asar")\n\t\t\tos.Rename(live, live+".backup-"+c.Session)\n\t\t\tcontent := "new"\n\t\t\tphase := "launching"\n\t\t\tif kind == "unknown" {\n\t\t\t\tcontent = "unknown"\n\t\t\t}\n\t\t\tif kind == "healthy" {\n\t\t\t\tphase = "healthy"\n\t\t\t}\n\t\t\tif kind == "corrupt-backup" {\n\t\t\t\tos.WriteFile(live+".backup-"+c.Session, []byte("bad"), 0600)\n\t\t\t}\n\t\t\tos.WriteFile(live, []byte(content), 0600)\n\t\t\tatomic(filepath.Join(c.Work, "active.json"), Journal{c.Session, phase, sha([]byte("old")), sha([]byte("new"))})\n\t\t\tif Recover(c.Root, c.Work) == nil {\n\t\t\t\tt.Fatal("unsafe recovery accepted")\n\t\t\t}\n\t\t\tb, _ := os.ReadFile(live)\n\t\t\tif string(b) != content {\n\t\t\t\tt.Fatal("live changed")\n\t\t\t}\n\t\t})\n\t}\n}\nfunc TestRecoveryRefusesRunningBuddy(t *testing.T) {\n\tc, _, _ := candidateTree(t)\n\tlive := filepath.Join(c.Root, "resources", "app.asar")\n\tos.Rename(live, live+".backup-"+c.Session)\n\tos.WriteFile(live, []byte("new"), 0600)\n\tatomic(filepath.Join(c.Work, "active.json"), Journal{c.Session, "launching", sha([]byte("old")), sha([]byte("new"))})\n\tif Recover(c.Root, c.Work) == nil {\n\t\tt.Fatal("recovered while app alive")\n\t}\n}\nfunc TestStaleLockFileNotActiveLock(t *testing.T) {\n\tc, _, _ := candidateTree(t)\n\tp := filepath.Join(c.Work, "helper.lock")\n\tos.WriteFile(p, []byte("stale"), 0600)\n\tunlock, e := transactionLock(p)\n\tif e != nil {\n\t\tt.Fatal(e)\n\t}\n\tdefer unlock()\n\tif second, e := transactionLock(p); e == nil {\n\t\tsecond()\n\t\tt.Fatal("concurrent lock allowed")\n\t}\n}\nfunc TestPendingJournalRefusedWithoutMutation(t *testing.T) {\n\tc, pub, _ := candidateTree(t)\n\tos.WriteFile(filepath.Join(c.Work, "active.json.new"), []byte("partial"), 0600)\n\tif RunCandidate(c, pub) == nil {\n\t\tt.Fatal("partial journal ignored")\n\t}\n\tb, _ := os.ReadFile(filepath.Join(c.Root, "resources", "app.asar"))\n\tif string(b) != "old" {\n\t\tt.Fatal("changed original")\n\t}\n}\n\n// Parent forcibly terminates the engine process, releasing its real OS lock.\n// This is instrumented process interruption, not a power-loss simulation.\nfunc TestForcedEngineTerminationRecovery(t *testing.T) {\n\tfor _, phase := range []string{"backing-up", "installing", "launching"} {\n\t\tt.Run(phase, func(t *testing.T) {\n\t\t\tc, pub, old := candidateTree(t)\n\t\t\tc.Timeout = 5 * time.Second\n\t\t\tconfig, _ := json.Marshal(struct {\n\t\t\t\tC Config\n\t\t\t\tK []byte\n\t\t\t}{c, []byte(pub)})\n\t\t\tconfigPath := filepath.Join(c.Work, "config.json")\n\t\t\tos.WriteFile(configPath, config, 0600)\n\t\t\tbin, _ := os.Executable()\n\t\t\tchild := exec.Command(bin)\n\t\t\tchild.Env = append(os.Environ(), "BUDDY_KILL_ENGINE=1", "BUDDY_KILL_CONFIG="+configPath, "BUDDY_KILL_PHASE="+phase)\n\t\t\tif e := child.Start(); e != nil {\n\t\t\t\tt.Fatal(e)\n\t\t\t}\n\t\t\tdefer func() { child.Process.Kill(); child.Wait() }()\n\t\t\tdeadline := time.Now().Add(5 * time.Second)\n\t\t\tready := filepath.Join(c.Work, "ready-"+c.Session)\n\t\t\tfor {\n\t\t\t\tif _, e := os.Stat(ready); e == nil {\n\t\t\t\t\tbreak\n\t\t\t\t}\n\t\t\t\tif time.Now().After(deadline) {\n\t\t\t\t\tt.Fatal("no ready")\n\t\t\t\t}\n\t\t\t\ttime.Sleep(10 * time.Millisecond)\n\t\t\t}\n\t\t\tos.WriteFile(filepath.Join(c.Work, "approve-"+c.Session), []byte(c.Session), 0600)\n\t\t\told.Process.Kill()\n\t\t\told.Wait()\n\t\t\tfor {\n\t\t\t\tif _, e := os.Stat(filepath.Join(c.Work, "checkpoint")); e == nil {\n\t\t\t\t\tbreak\n\t\t\t\t}\n\t\t\t\tif time.Now().After(deadline) {\n\t\t\t\t\tt.Fatal("no checkpoint")\n\t\t\t\t}\n\t\t\t\ttime.Sleep(10 * time.Millisecond)\n\t\t\t}\n\t\t\tchild.Process.Kill()\n\t\t\tchild.Wait()\n\t\t\terr := Recover(c.Root, c.Work)\n\t\t\tif phase == "backing-up" {\n\t\t\t\tif err == nil {\n\t\t\t\t\tt.Fatal("should preserve pre-rename journal for review")\n\t\t\t\t}\n\t\t\t} else if err != nil {\n\t\t\t\tt.Fatal(err)\n\t\t\t}\n\t\t\tb, _ := os.ReadFile(filepath.Join(c.Root, "resources", "app.asar"))\n\t\t\tif string(b) != "old" {\n\t\t\t\tt.Fatal("old archive not preserved/restored")\n\t\t\t}\n\t\t})\n\t}\n}\n', encoding='utf-8')
