          (root / 'recovery-ui-test.cjs').write_text("// Only synthetic app archives and transaction data. No user app data.\nconst fs=require('fs'),path=require('path'),assert=require('assert/strict'),crypto=require('crypto');\n(async()=>{const {_electron}=require('playwright-core');const helper=path.join(process.cwd(),'buddy-helper.exe'),root=path.join(process.cwd(),'recovery-fixture'),work=path.join(process.cwd(),'recovery-work');fs.mkdirSync(path.join(root,'resources'),{recursive:true});fs.mkdirSync(work);fs.copyFileSync(helper,path.join(root,'Spark Buddy.exe'));const session='b'.repeat(48),live=path.join(root,'resources','app.asar'),backup=live+'.backup-'+session;fs.writeFileSync(live,'new');fs.writeFileSync(backup,'old');const sha=s=>crypto.createHash('sha256').update(s).digest('hex');fs.writeFileSync(path.join(work,'active.json'),JSON.stringify({Session:session,Phase:'launching',OldHash:sha('old'),NewHash:sha('new')}));const args=[path.join(process.cwd(),'recovery-main.cjs'),helper,root,work];\n let app=await _electron.launch({args,timeout:30000});let page=await app.firstWindow();await page.locator('#restore:not([disabled])').waitFor();assert.equal(await page.locator('#session').textContent(),session);await page.locator('#cancel').click();await app.close().catch(()=>{});assert.equal(fs.readFileSync(live,'utf8'),'new');assert.equal(fs.readFileSync(backup,'utf8'),'old');console.log('PASS recovery UI cancel leaves synthetic archives unchanged');\n app=await _electron.launch({args,timeout:30000});page=await app.firstWindow();await page.locator('#restore:not([disabled])').waitFor();await page.locator('#restore').click();await page.getByText('Previous app archive restored.',{exact:false}).waitFor();assert.equal(fs.readFileSync(live,'utf8'),'old');assert.equal(fs.readFileSync(live+'.failed-'+session,'utf8'),'new');await app.close();console.log('PASS recovery UI explicit session approval restores verified backup and retains failed archive. Synthetic fixture only.');\n})().then(()=>process.exit(0)).catch(e=>{console.error(e.message);process.exit(1)});\n", encoding='utf-8')
