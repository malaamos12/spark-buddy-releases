          (root / 'bootstrap.go').write_text('// Development-only bootstrap transaction. Payload supplied by reproducible local build.\npackage updater\n\nimport (\n\t"encoding/json"\n\t"errors"\n\t"fmt"\n\t"os"\n\t"os/exec"\n\t"path/filepath"\n\t"time"\n)\n\ntype BootstrapConfig struct {\n\tRoot, Data, BackupParent, Session, OldHash, NewHash, HelperHash, Version string\n\tPayload, Helper                                                          []byte\n\tTimeout                                                                  time.Duration\n}\ntype BootstrapResult struct {\n\tBackup, Journal string\n\tRolledBack      bool\n}\n\nfunc Bootstrap(c BootstrapConfig) (result BootstrapResult, err error) {\n\tif !validToken(c.Session) || sha(c.Payload) != c.NewHash || sha(c.Helper) != c.HelperHash {\n\t\treturn result, errors.New("embedded build integrity failed")\n\t}\n\tif c.Timeout < 5*time.Second || c.Timeout > 2*time.Minute {\n\t\treturn result, errors.New("invalid deadline")\n\t}\n\tfor _, p := range []string{c.Root, c.Data, c.BackupParent} {\n\t\tif !filepath.IsAbs(p) {\n\t\t\treturn result, errors.New("absolute paths required")\n\t\t}\n\t\tif e := safePath(p); e != nil {\n\t\t\treturn result, e\n\t\t}\n\t}\n\tlive := filepath.Join(c.Root, "resources", "app.asar")\n\texe := filepath.Join(c.Root, "Spark Buddy.exe")\n\thelper := filepath.Join(c.Root, "buddy-updater-helper.exe")\n\tif e := validateRuntime(exe); e != nil {\n\t\treturn result, e\n\t}\n\tif e := regular(exe); e != nil {\n\t\treturn result, e\n\t}\n\tif e := regular(live); e != nil {\n\t\treturn result, e\n\t}\n\th, e := hashFile(live)\n\tif e != nil || h != c.OldHash {\n\t\treturn result, errors.New("installation changed or unsupported")\n\t}\n\tif e = noBuddyProcesses(exe); e != nil {\n\t\treturn result, e\n\t}\n\t// Require the supported existing data schema, never guess a missing data folder.\n\tif e = validateBuddyData(c.Data); e != nil {\n\t\treturn result, e\n\t}\n\twork := filepath.Join(c.BackupParent, c.Session)\n\tif e = restrictedDirectory(work); e != nil {\n\t\treturn result, e\n\t}\n\tresult.Backup = work\n\tresult.Journal = filepath.Join(work, "bootstrap.json")\n\tunlock, e := transactionLock(filepath.Join(c.Root, "resources", "buddy-repair.lock"))\n\tif e != nil {\n\t\treturn result, e\n\t}\n\tdefer unlock()\n\tfor _, p := range []string{helper, live + ".backup-" + c.Session, live + ".staged-" + c.Session, c.Data + ".failed-" + c.Session, c.Data + ".restore-" + c.Session} {\n\t\tif _, e = os.Lstat(p); !os.IsNotExist(e) {\n\t\t\treturn result, errors.New("existing repair file requires review")\n\t\t}\n\t}\n\tfor _, p := range []string{c.Data, c.Root, c.BackupParent} {\n\t\tif e = availableSpaceOn(c.Data, p, int64(len(c.Payload))*3); e != nil {\n\t\t\treturn result, e\n\t\t}\n\t}\n\tsnapshot := filepath.Join(work, "data-before")\n\tm, e := Snapshot(c.Data, snapshot)\n\tif e != nil {\n\t\treturn result, e\n\t}\n\tif e = WriteSnapshotManifest(filepath.Join(work, "snapshot.json"), m); e != nil {\n\t\treturn result, e\n\t}\n\tif e = noBuddyProcesses(exe); e != nil {\n\t\treturn result, e\n\t}\n\tif e = VerifySnapshot(c.Data, m); e != nil {\n\t\treturn result, errors.New("data changed after backup")\n\t}\n\th, e = hashFile(live)\n\tif e != nil || h != c.OldHash {\n\t\treturn result, errors.New("installation changed during backup")\n\t}\n\tstage := live + ".staged-" + c.Session\n\twrite := func(p string, b []byte) error {\n\t\tf, e := os.OpenFile(p, os.O_CREATE|os.O_EXCL|os.O_WRONLY, 0600)\n\t\tif e != nil {\n\t\t\treturn e\n\t\t}\n\t\t_, e = f.Write(b)\n\t\tif e == nil {\n\t\t\te = f.Sync()\n\t\t}\n\t\tclosed := f.Close()\n\t\tif e != nil {\n\t\t\treturn e\n\t\t}\n\t\treturn closed\n\t}\n\tif e = write(stage, c.Payload); e != nil {\n\t\treturn result, e\n\t}\n\tif e = write(helper, c.Helper); e != nil {\n\t\treturn result, e\n\t}\n\tjournal := map[string]string{"session": c.Session, "phase": "backed-up", "oldHash": c.OldHash, "newHash": c.NewHash, "data": c.Data, "root": c.Root}\n\tphase := func(p string) error { journal["phase"] = p; return atomic(result.Journal, journal) }\n\tfor p, want := range map[string]string{stage: c.NewHash, helper: c.HelperHash} {\n\t\th, e := hashFile(p)\n\t\tif e != nil || h != want {\n\t\t\treturn result, errors.New("staged build changed")\n\t\t}\n\t}\n\tif e = phase("backing-up-archive"); e != nil {\n\t\treturn result, e\n\t}\n\tcheckpoint("bootstrap-before-archive-rename")\n\tarchiveBackup := live + ".backup-" + c.Session\n\tif e = renameRetry(live, archiveBackup, 5*time.Second); e != nil {\n\t\treturn result, e\n\t}\n\trollback := func(cause error) (BootstrapResult, error) {\n\t\tif e := noBuddyProcesses(exe); e != nil {\n\t\t\treturn result, fmt.Errorf("%v; Buddy process still active, restore paused", cause)\n\t\t}\n\t\tif e := VerifySnapshot(snapshot, m); e != nil {\n\t\t\treturn result, fmt.Errorf("%v; data backup failed recheck", cause)\n\t\t}\n\t\tif e := phase("restoring"); e != nil {\n\t\t\treturn result, e\n\t\t}\n\t\tif _, e := os.Lstat(live); e == nil {\n\t\t\th, e := hashFile(live)\n\t\t\tif e != nil || h != c.NewHash {\n\t\t\t\treturn result, errors.New("unknown live archive, restore paused")\n\t\t\t}\n\t\t\tif e = renameRetry(live, live+".failed-"+c.Session, 5*time.Second); e != nil {\n\t\t\t\treturn result, e\n\t\t\t}\n\t\t}\n\t\th, e := hashFile(archiveBackup)\n\t\tif e != nil || h != c.OldHash {\n\t\t\treturn result, errors.New("archive backup failed recheck")\n\t\t}\n\t\trestored := c.Data + ".restore-" + c.Session\n\t\trm, e := Snapshot(snapshot, restored)\n\t\tif e != nil {\n\t\t\treturn result, e\n\t\t}\n\t\tif len(rm.Files) != len(m.Files) {\n\t\t\treturn result, errors.New("data restore count mismatch")\n\t\t}\n\t\tif e = noBuddyProcesses(exe); e != nil {\n\t\t\treturn result, e\n\t\t}\n\t\tif e = os.Rename(c.Data, c.Data+".failed-"+c.Session); e != nil {\n\t\t\treturn result, e\n\t\t}\n\t\tcheckpoint("bootstrap-data-preserved")\n\t\tif e = os.Rename(restored, c.Data); e != nil {\n\t\t\treturn result, fmt.Errorf("data rename incomplete; preserved paths in %s", work)\n\t\t}\n\t\tcheckpoint("bootstrap-data-restored")\n\t\tif e = renameRetry(archiveBackup, live, 5*time.Second); e != nil {\n\t\t\treturn result, e\n\t\t}\n\t\tif e = os.Rename(helper, helper+".failed-"+c.Session); e != nil {\n\t\t\treturn result, e\n\t\t}\n\t\tresult.RolledBack = true\n\t\t_ = phase("rolled-back")\n\t\treturn result, cause\n\t}\n\tif e = phase("installing"); e != nil {\n\t\treturn rollback(e)\n\t}\n\tif e = renameRetry(stage, live, 5*time.Second); e != nil {\n\t\treturn rollback(e)\n\t}\n\tif e = phase("launching"); e != nil {\n\t\treturn rollback(e)\n\t}\n\tcmd := exec.Command(exe, "--update-health")\n\tcmd.Dir = c.Root\n\tcmd.Env = append(os.Environ(), "BUDDY_UPDATE_SESSION="+c.Session, "BUDDY_UPDATE_WORK="+work)\n\tif e = cmd.Start(); e != nil {\n\t\treturn rollback(e)\n\t}\n\tdone := make(chan error, 1)\n\tgo func() { done <- cmd.Wait() }()\n\ttimer := time.NewTimer(c.Timeout)\n\tdefer timer.Stop()\n\ttick := time.NewTicker(50 * time.Millisecond)\n\tdefer tick.Stop()\n\tfor {\n\t\tselect {\n\t\tcase <-done:\n\t\t\treturn rollback(errors.New("new Buddy exited before health"))\n\t\tcase <-timer.C:\n\t\t\tif e = stopOwnedProcess(cmd); e != nil {\n\t\t\t\treturn result, e\n\t\t\t}\n\t\t\t<-done\n\t\t\treturn rollback(errors.New("new Buddy failed startup health"))\n\t\tcase <-tick.C:\n\t\t\tb, e := os.ReadFile(filepath.Join(work, "health-"+c.Session))\n\t\t\tif e == nil && string(b) == c.Session+" "+c.Version {\n\t\t\t\tif e = phase("healthy"); e != nil {\n\t\t\t\t\treturn result, e\n\t\t\t\t}\n\t\t\t\treturn result, nil\n\t\t\t}\n\t\t}\n\t}\n}\n\nfunc validateBuddyData(p string) error {\n\tf := filepath.Join(p, "state.json")\n\tif e := regular(f); e != nil {\n\t\treturn e\n\t}\n\tb, e := os.ReadFile(f)\n\tif e != nil {\n\t\treturn e\n\t}\n\tvar v struct {\n\t\tVersion   int            `json:"version"`\n\t\tSettings  map[string]any `json:"settings"`\n\t\tTasks     []any          `json:"tasks"`\n\t\tReminders []any          `json:"reminders"`\n\t}\n\tif json.Unmarshal(b, &v) != nil || v.Version != 1 || v.Settings == nil || v.Tasks == nil || v.Reminders == nil {\n\t\treturn errors.New("unsupported or incomplete Buddy data")\n\t}\n\treturn nil\n}\n', encoding='utf-8')
