name: Buddy updater Windows tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-windows-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Test isolated updater prototype, not a repair release
        shell: python
        run: |
          import pathlib, subprocess, tempfile
          root = pathlib.Path(tempfile.mkdtemp(prefix='buddy-updater-tests-'))
          (root / 'go.mod').write_text('module buddy-updater-tests\n\ngo 1.22\n', encoding='utf-8')
          (root / 'transaction.go').write_text('// Test-only transaction prototype. Not wired to Buddy or distributed as a repair.\npackage updater\n\nimport (\n\t"crypto/ed25519"\n\t"crypto/sha256"\n\t"encoding/base64"\n\t"encoding/hex"\n\t"encoding/json"\n\t"errors"\n\t"fmt"\n\t"net/url"\n\t"os"\n\t"path/filepath"\n\t"strconv"\n\t"strings"\n\t"time"\n)\n\ntype Manifest struct {\n\tVersion string `json:"version"`\n\tSHA256  string `json:"sha256"`\n\tBytes   int64  `json:"bytes"`\n\tURL     string `json:"url"`\n\tKind    string `json:"kind"`\n\tRuntime string `json:"runtime"`\n}\ntype Envelope struct {\n\tPayload   string `json:"payload"`\n\tSignature string `json:"signature"`\n}\n\nfunc Verify(raw, data []byte, key ed25519.PublicKey, current, runtime string) (Manifest, error) {\n\tvar e Envelope\n\tvar m Manifest\n\tif len(raw) > 32768 {\n\t\treturn m, errors.New("envelope too large")\n\t}\n\tif json.Unmarshal(raw, &e) != nil {\n\t\treturn m, errors.New("bad envelope")\n\t}\n\tsig, err := base64.StdEncoding.DecodeString(e.Signature)\n\tif err != nil || !ed25519.Verify(key, []byte(e.Payload), sig) {\n\t\treturn m, errors.New("invalid signature")\n\t}\n\tif json.Unmarshal([]byte(e.Payload), &m) != nil {\n\t\treturn m, errors.New("bad payload")\n\t}\n\ta, err := version(m.Version)\n\tif err != nil {\n\t\treturn m, err\n\t}\n\tb, err := version(current)\n\tif err != nil {\n\t\treturn m, err\n\t}\n\tnewer := false\n\tfor i := 0; i < 3; i++ {\n\t\tif a[i] != b[i] {\n\t\t\tnewer = a[i] > b[i]\n\t\t\tbreak\n\t\t}\n\t}\n\tif !newer {\n\t\treturn m, errors.New("not newer")\n\t}\n\tu, err := url.Parse(m.URL)\n\tif err != nil || u.Scheme != "https" || u.Host != "github.com" || u.User != nil || !strings.HasPrefix(u.Path, "/malaamos12/spark-buddy-releases/releases/download/") || u.RawQuery != "" || u.Fragment != "" {\n\t\treturn m, errors.New("wrong source")\n\t}\n\tif m.Kind != "asar" || m.Runtime != runtime || m.Bytes < 1 || m.Bytes > 30*1024*1024 || int64(len(data)) != m.Bytes {\n\t\treturn m, errors.New("incompatible payload")\n\t}\n\tsum := sha256.Sum256(data)\n\tif hex.EncodeToString(sum[:]) != m.SHA256 {\n\t\treturn m, errors.New("hash mismatch")\n\t}\n\treturn m, nil\n}\nfunc version(v string) ([3]uint64, error) {\n\tvar r [3]uint64\n\tp := strings.Split(v, ".")\n\tif len(p) != 3 {\n\t\treturn r, errors.New("invalid version")\n\t}\n\tfor i, s := range p {\n\t\tif s == "" || strings.Trim(s, "0123456789") != "" {\n\t\t\treturn r, errors.New("invalid version")\n\t\t}\n\t\tn, e := strconv.ParseUint(s, 10, 53)\n\t\tif e != nil {\n\t\t\treturn r, e\n\t\t}\n\t\tr[i] = n\n\t}\n\treturn r, nil\n}\n\n// Run only operates on an isolated, already verified fixture tree. Production\n// integration still needs secure path validation, session binding and recovery.\nfunc Run(root string, ready func() error, waitOld func() error, startAndHealth func() error) error {\n\tlog, err := os.OpenFile(filepath.Join(root, "transaction.log"), os.O_CREATE|os.O_EXCL|os.O_WRONLY, 0600)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer log.Close()\n\tnote := func(s string) error {\n\t\tif _, e := fmt.Fprintln(log, s); e != nil {\n\t\t\treturn e\n\t\t}\n\t\treturn log.Sync()\n\t}\n\tif err = note("preflight"); err != nil {\n\t\treturn err\n\t}\n\tlive := filepath.Join(root, "app.asar")\n\tstage := filepath.Join(root, "next.asar")\n\tbackup := filepath.Join(root, "app.asar.previous")\n\tfor _, p := range []string{live, stage} {\n\t\ts, e := os.Lstat(p)\n\t\tif e != nil {\n\t\t\treturn e\n\t\t}\n\t\tif !s.Mode().IsRegular() {\n\t\t\treturn errors.New("not regular file")\n\t\t}\n\t}\n\tif _, e := os.Lstat(backup); !os.IsNotExist(e) {\n\t\treturn errors.New("backup exists or unreadable")\n\t}\n\tif err = ready(); err != nil {\n\t\treturn err\n\t}\n\tif err = note("ready"); err != nil {\n\t\treturn err\n\t}\n\tif err = waitOld(); err != nil {\n\t\treturn err\n\t}\n\tif err = note("old exited"); err != nil {\n\t\treturn err\n\t}\n\tif err = move(live, backup); err != nil {\n\t\treturn err\n\t}\n\tif err = note("backed up"); err != nil {\n\t\t_ = move(backup, live)\n\t\treturn err\n\t}\n\trollback := func(cause error) error {\n\t\tif _, e := os.Lstat(live); e == nil {\n\t\t\tif e = os.Rename(live, filepath.Join(root, "failed.asar")); e != nil {\n\t\t\t\treturn fmt.Errorf("%v; preserve failed: %w", cause, e)\n\t\t\t}\n\t\t}\n\t\tif e := move(backup, live); e != nil {\n\t\t\treturn fmt.Errorf("%v; rollback: %w", cause, e)\n\t\t}\n\t\t_ = note("rolled back")\n\t\treturn cause\n\t}\n\tif err = move(stage, live); err != nil {\n\t\treturn rollback(err)\n\t}\n\tif err = note("replaced"); err != nil {\n\t\treturn rollback(err)\n\t}\n\tif err = startAndHealth(); err != nil {\n\t\treturn rollback(err)\n\t}\n\treturn note("healthy")\n}\nfunc move(a, b string) error {\n\tvar e error\n\tfor i := 0; i < 6; i++ {\n\t\te = os.Rename(a, b)\n\t\tif e == nil {\n\t\t\treturn nil\n\t\t}\n\t\ttime.Sleep(20 * time.Millisecond)\n\t}\n\treturn e\n}\n', encoding='utf-8')
          (root / 'transaction_test.go').write_text('package updater\n\nimport (\n\t"crypto/ed25519"\n\t"crypto/rand"\n\t"crypto/sha256"\n\t"encoding/base64"\n\t"encoding/hex"\n\t"encoding/json"\n\t"errors"\n\t"os"\n\t"path/filepath"\n\t"strings"\n\t"testing"\n)\n\nfunc tree(t *testing.T) string {\n\tt.Helper()\n\tr := filepath.Join(t.TempDir(), "Buddy\'s space عربي")\n\tif e := os.Mkdir(r, 0700); e != nil {\n\t\tt.Fatal(e)\n\t}\n\tos.WriteFile(filepath.Join(r, "app.asar"), []byte("old"), 0600)\n\tos.WriteFile(filepath.Join(r, "next.asar"), []byte("new"), 0600)\n\treturn r\n}\nfunc read(t *testing.T, r, n string) string {\n\tt.Helper()\n\tb, e := os.ReadFile(filepath.Join(r, n))\n\tif e != nil {\n\t\tt.Fatal(e)\n\t}\n\treturn string(b)\n}\nfunc ok() error { return nil }\nfunc TestTransactionSuccess(t *testing.T) {\n\tr := tree(t)\n\tif e := Run(r, ok, ok, ok); e != nil {\n\t\tt.Fatal(e)\n\t}\n\tif read(t, r, "app.asar") != "new" || read(t, r, "app.asar.previous") != "old" {\n\t\tt.Fatal("wrong archive")\n\t}\n\tif !strings.Contains(read(t, r, "transaction.log"), "healthy") {\n\t\tt.Fatal("missing log")\n\t}\n}\nfunc TestReadinessFailureLeavesArchive(t *testing.T) {\n\tr := tree(t)\n\te := Run(r, func() error { return errors.New("helper blocked") }, func() error { t.Fatal("app asked to exit"); return nil }, ok)\n\tif e == nil || read(t, r, "app.asar") != "old" {\n\t\tt.Fatal("readiness damaged live")\n\t}\n}\nfunc TestOldProcessTimeout(t *testing.T) {\n\tr := tree(t)\n\te := Run(r, ok, func() error { return errors.New("still running") }, ok)\n\tif e == nil || read(t, r, "app.asar") != "old" {\n\t\tt.Fatal("timeout damaged live")\n\t}\n}\nfunc TestFailedHealthRollsBack(t *testing.T) {\n\tr := tree(t)\n\te := Run(r, ok, ok, func() error { return errors.New("no health") })\n\tif e == nil || read(t, r, "app.asar") != "old" || read(t, r, "failed.asar") != "new" {\n\t\tt.Fatal("rollback failed")\n\t}\n}\nfunc TestExistingBackupPreserved(t *testing.T) {\n\tr := tree(t)\n\tos.WriteFile(filepath.Join(r, "app.asar.previous"), []byte("precious"), 0600)\n\tif Run(r, ok, ok, ok) == nil {\n\t\tt.Fatal("accepted existing backup")\n\t}\n\tif read(t, r, "app.asar.previous") != "precious" || read(t, r, "app.asar") != "old" {\n\t\tt.Fatal("backup lost")\n\t}\n}\nfunc TestIncompleteTransactionRefused(t *testing.T) {\n\tr := tree(t)\n\tos.WriteFile(filepath.Join(r, "transaction.log"), []byte("previous"), 0600)\n\tif Run(r, ok, ok, ok) == nil {\n\t\tt.Fatal("accepted existing transaction")\n\t}\n\tif read(t, r, "app.asar") != "old" {\n\t\tt.Fatal("changed live")\n\t}\n}\nfunc TestManifest(t *testing.T) {\n\tpub, priv, e := ed25519.GenerateKey(rand.Reader)\n\tif e != nil {\n\t\tt.Fatal(e)\n\t}\n\tdata := []byte("test archive")\n\tsum := sha256.Sum256(data)\n\tm := Manifest{Version: "4.1.1", SHA256: hex.EncodeToString(sum[:]), Bytes: int64(len(data)), URL: "https://github.com/malaamos12/spark-buddy-releases/releases/download/v4.1.1/app.asar", Kind: "asar", Runtime: "45.4.1"}\n\tpack := func(m Manifest) []byte {\n\t\tb, _ := json.Marshal(m)\n\t\tx, _ := json.Marshal(Envelope{string(b), base64.StdEncoding.EncodeToString(ed25519.Sign(priv, b))})\n\t\treturn x\n\t}\n\tif _, e = Verify(pack(m), data, pub, "4.0.2", "45.4.1"); e != nil {\n\t\tt.Fatal(e)\n\t}\n\tfor _, change := range []func(*Manifest){func(x *Manifest) { x.URL = "https://github.com/other/repo/releases/download/v1/app.asar" }, func(x *Manifest) { x.Version = "4.0.1" }, func(x *Manifest) { x.Runtime = "other" }, func(x *Manifest) { x.Bytes++ }, func(x *Manifest) { x.SHA256 = strings.Repeat("0", 64) }} {\n\t\tx := m\n\t\tchange(&x)\n\t\tif _, e = Verify(pack(x), data, pub, "4.0.2", "45.4.1"); e == nil {\n\t\t\tt.Fatal("accepted bad metadata")\n\t\t}\n\t}\n\traw := pack(m)\n\traw[len(raw)/2] ^= 1\n\tif _, e = Verify(raw, data, pub, "4.0.2", "45.4.1"); e == nil {\n\t\tt.Fatal("accepted tampering")\n\t}\n}\n', encoding='utf-8')
          (root / 'windows_test.go').write_text('//go:build windows\n\npackage updater\n\nimport (\n\t"os"\n\t"path/filepath"\n\t"syscall"\n\t"testing"\n)\n\nfunc TestWindowsLockedArchiveLeavesOriginal(t *testing.T) {\n\tr := tree(t)\n\tp, e := syscall.UTF16PtrFromString(filepath.Join(r, "app.asar"))\n\tif e != nil {\n\t\tt.Fatal(e)\n\t}\n\th, e := syscall.CreateFile(p, syscall.GENERIC_READ, syscall.FILE_SHARE_READ, nil, syscall.OPEN_EXISTING, 0, 0)\n\tif e != nil {\n\t\tt.Fatal(e)\n\t}\n\tdefer syscall.CloseHandle(h)\n\tif Run(r, ok, ok, ok) == nil {\n\t\tt.Fatal("renamed locked Windows archive")\n\t}\n\tif read(t, r, "app.asar") != "old" {\n\t\tt.Fatal("lost locked archive")\n\t}\n\tif _, e = os.Stat(filepath.Join(r, "app.asar.previous")); !os.IsNotExist(e) {\n\t\tt.Fatal("unexpected backup")\n\t}\n}\n', encoding='utf-8')
          (root / 'process_test.go').write_text('package updater\n\nimport (\n\t"errors"\n\t"os"\n\t"os/exec"\n\t"path/filepath"\n\t"strings"\n\t"testing"\n\t"time"\n)\n\n// The fixture is a separate native process, not a mocked process callback.\nfunc TestProcessFixture(t *testing.T) {\n\tif os.Getenv("BUDDY_SYNTHETIC_FIXTURE") != "1" {\n\t\treturn\n\t}\n\tswitch os.Getenv("BUDDY_FIXTURE_MODE") {\n\tcase "old":\n\t\ttime.Sleep(200 * time.Millisecond)\n\tcase "healthy", "wrong-token":\n\t\twd, e := os.Getwd()\n\t\tif e != nil {\n\t\t\tos.Exit(2)\n\t\t}\n\t\tcontent, e := os.ReadFile(filepath.Join(wd, "app.asar"))\n\t\tif e != nil || string(content) != "new" {\n\t\t\tos.Exit(3)\n\t\t}\n\t\ttoken := os.Getenv("BUDDY_FIXTURE_TOKEN")\n\t\tif os.Getenv("BUDDY_FIXTURE_MODE") == "wrong-token" {\n\t\t\ttoken = "stale"\n\t\t}\n\t\tif os.WriteFile(filepath.Join(wd, "health"), []byte(token), 0600) != nil {\n\t\t\tos.Exit(4)\n\t\t}\n\t\ttime.Sleep(2 * time.Second)\n\tcase "no-health":\n\t\ttime.Sleep(2 * time.Second)\n\tcase "crash":\n\t\tos.Exit(5)\n\tdefault:\n\t\tos.Exit(6)\n\t}\n\tos.Exit(0)\n}\nfunc fixture(t *testing.T, root, mode, token string) *exec.Cmd {\n\tt.Helper()\n\texe, e := os.Executable()\n\tif e != nil {\n\t\tt.Fatal(e)\n\t}\n\tc := exec.Command(exe, "-test.run=^TestProcessFixture$")\n\tc.Dir = root\n\tc.Env = append(os.Environ(), "BUDDY_SYNTHETIC_FIXTURE=1", "BUDDY_FIXTURE_MODE="+mode, "BUDDY_FIXTURE_TOKEN="+token)\n\tif e = c.Start(); e != nil {\n\t\tt.Fatal(e)\n\t}\n\tt.Cleanup(func() { _ = c.Process.Kill() })\n\treturn c\n}\nfunc startHealth(t *testing.T, root, mode, token string) error {\n\tt.Helper()\n\thealth := filepath.Join(root, "health")\n\tif e := os.Remove(health); e != nil && !os.IsNotExist(e) {\n\t\treturn e\n\t}\n\tc := fixture(t, root, mode, token)\n\tdone := make(chan error, 1)\n\tgo func() { done <- c.Wait() }()\n\ttimer := time.NewTimer(700 * time.Millisecond)\n\tdefer timer.Stop()\n\ttick := time.NewTicker(10 * time.Millisecond)\n\tdefer tick.Stop()\n\tfor {\n\t\tselect {\n\t\tcase <-done:\n\t\t\treturn errors.New("child exited before health")\n\t\tcase <-timer.C:\n\t\t\t_ = c.Process.Kill()\n\t\t\t<-done\n\t\t\treturn errors.New("health timeout")\n\t\tcase <-tick.C:\n\t\t\tb, e := os.ReadFile(health)\n\t\t\tif e == nil && string(b) == token { // Test kills/reaps fixture before returning, production must keep real app running.\n\t\t\t\t_ = c.Process.Kill()\n\t\t\t\t<-done\n\t\t\t\treturn nil\n\t\t\t}\n\t\t}\n\t}\n}\nfunc TestRealProcessReplacementAndWorkingDirectory(t *testing.T) {\n\tr := tree(t)\n\told := fixture(t, r, "old", "")\n\te := Run(r, ok, func() error { return old.Wait() }, func() error { return startHealth(t, r, "healthy", "unique-session-1") })\n\tif e != nil {\n\t\tt.Fatal(e)\n\t}\n\tif read(t, r, "app.asar") != "new" {\n\t\tt.Fatal("new archive missing")\n\t}\n}\nfunc TestRealProcessFailedHealthRollback(t *testing.T) {\n\tfor _, mode := range []string{"wrong-token", "no-health", "crash"} {\n\t\tt.Run(mode, func(t *testing.T) {\n\t\t\tr := tree(t)\n\t\t\tos.WriteFile(filepath.Join(r, "health"), []byte("unique-session-2"), 0600)\n\t\t\te := Run(r, ok, ok, func() error { return startHealth(t, r, mode, "unique-session-2") })\n\t\t\tif e == nil {\n\t\t\t\tt.Fatal("accepted unhealthy child")\n\t\t\t}\n\t\t\tif read(t, r, "app.asar") != "old" {\n\t\t\t\tt.Fatal("old archive not restored")\n\t\t\t}\n\t\t\tif !strings.Contains(read(t, r, "transaction.log"), "rolled back") {\n\t\t\t\tt.Fatal("missing recovery log")\n\t\t\t}\n\t\t})\n\t}\n}\n', encoding='utf-8')
          print('Synthetic transaction and native process fixtures only.', flush=True)
          subprocess.run(['go', 'version'], check=True)
          subprocess.run(['go', 'test', '-v', '-count=1', './...'], cwd=root, check=True, timeout=300)
      - name: Actual packaged Buddy archive transition in isolated data
        shell: python
        run: |
          import pathlib, subprocess, tempfile, os
          root = pathlib.Path(tempfile.mkdtemp(prefix='buddy-electron-test-'))
          (root / "electron-transition.cjs").write_text('// Development-only Windows packaged-Electron archive transition, not production helper.\nconst fs=require(\'fs\'),path=require(\'path\'),https=require(\'https\'),assert=require(\'assert/strict\'),crypto=require(\'crypto\');\nfunction download(url,dest){return new Promise((resolve,reject)=>{https.get(url,res=>{if(res.statusCode>=300&&res.statusCode<400){res.resume();return download(new URL(res.headers.location,url).href,dest).then(resolve,reject)}if(res.statusCode!==200)return reject(Error(\'HTTP \'+res.statusCode));const out=fs.createWriteStream(dest);res.pipe(out);out.on(\'finish\',()=>out.close(resolve));out.on(\'error\',reject)}).on(\'error\',reject)})}\nasync function main(){\n const root=process.cwd(),folder=path.join(root,"Buddy\'s Windows transition عربي"),data=path.join(root,\'synthetic-data\');fs.mkdirSync(folder,{recursive:true});\n const {_electron}=require(\'playwright-core\');const {downloadArtifact}=require(\'@electron/get\');const zip=await downloadArtifact({version:\'45.4.1\',platform:\'win32\',arch:\'x64\',artifactName:\'electron\'});require(\'child_process\').execFileSync(\'python\',[\'-c\',\'import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])\',zip,folder],{stdio:\'inherit\'});assert(fs.existsSync(path.join(folder,\'electron.exe\')),\'verified Windows runtime did not contain electron.exe\');\n const exe=path.join(folder,\'Spark Buddy.exe\');fs.renameSync(path.join(folder,\'electron.exe\'),exe);const live=path.join(folder,\'resources\',\'app.asar\'),stage=path.join(folder,\'resources\',\'next.asar\');\n const assets=[[\'https://github.com/malaamos12/spark-buddy-releases/releases/download/v4.0.2/app.asar\',live,\'11c26357516da32d1f531606e8d24246b6b7c415131fbeca72f200773649480c\'],[\'https://github.com/malaamos12/spark-buddy-releases/releases/download/v4.1.0/app.asar\',stage,\'1f2e97470b1981eacd0e78174292e0d5f5b224d2b7f21540db8a007c25545520\']];\n for(const [url,dest,hash] of assets){await download(url,dest);assert.equal(crypto.createHash(\'sha256\').update(fs.readFileSync(dest)).digest(\'hex\'),hash)}\n const env={...process.env,SPARK_TEST_DATA:data};delete env.ELECTRON_RUN_AS_NODE;\n let app;\n try {\n  app=await _electron.launch({executablePath:exe,args:[],cwd:folder,env,timeout:45000});\n  assert.equal(await app.evaluate(({app})=>app.getVersion()),\'4.0.2\');\n  await app.firstWindow();console.log(\'PASS actual packaged 4.0.2 launched with isolated data\');\n  // Test driver exits old app before replacement. It is NOT the production updater.\n  await app.close();app=null;\n  fs.renameSync(live,live+\'.previous\');fs.renameSync(stage,live);\n  app=await _electron.launch({executablePath:exe,args:[\'--update-health\'],cwd:folder,env,timeout:45000});\n  assert.equal(await app.evaluate(({app})=>app.getVersion()),\'4.1.0\');\n  const ack=path.join(data,\'updates\',\'healthy.txt\');\n  const deadline=Date.now()+15000;while(!fs.existsSync(ack)&&Date.now()<deadline)await new Promise(r=>setTimeout(r,100));\n  assert(fs.existsSync(ack),\'missing actual Buddy health acknowledgment\');assert(fs.readFileSync(ack,\'utf8\').includes(\'4.1.0\'));\n  console.log(\'PASS actual packaged 4.0.2 -> 4.1.0 archive replacement, relaunch and Buddy startup health\');\n  assert.equal(crypto.createHash(\'sha256\').update(fs.readFileSync(live+\'.previous\')).digest(\'hex\'),assets[0][2]);\n  await app.close();app=null;\n  // Real app rollback launch, again isolated test driver only.\n  fs.renameSync(live,live+\'.tested\');fs.renameSync(live+\'.previous\',live);\n  app=await _electron.launch({executablePath:exe,args:[],cwd:folder,env,timeout:45000});assert.equal(await app.evaluate(({app})=>app.getVersion()),\'4.0.2\');\n  console.log(\'PASS original published archive relaunch after fixture rollback\');\n }finally{if(app)await app.close()}\n}\nmain().catch(e=>{console.error(e.message);process.exitCode=1});\n', encoding='utf-8')
          (root / "package.json").write_text('{"private": true, "dependencies": {"electron": "45.4.1", "playwright-core": "1.65.1"}}', encoding='utf-8')
          subprocess.run(['npm.cmd', 'install', '--no-audit', '--no-fund'], cwd=root, check=True, timeout=300)
          subprocess.run(['node', 'electron-transition.cjs'], cwd=root, check=True, timeout=240)
  exact-helper-candidate:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Compile candidate, test engine, then exact executable with Buddy
        shell: python
        run: |
          import pathlib, subprocess, tempfile
          root = pathlib.Path(tempfile.mkdtemp(prefix='buddy-exact-helper-'))
          (root / 'go.mod').parent.mkdir(parents=True, exist_ok=True)
