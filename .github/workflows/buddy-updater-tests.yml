          (root / 'recovery-main.cjs').write_text("// Development-only bootstrap recovery UI. Does not download, install, or launch Buddy.\nconst {app,BrowserWindow,ipcMain}=require('electron'),path=require('path'),{execFile}=require('child_process');\nconst [helper,root,work]=process.argv.slice(2);let win,reviewed;\nfunction run(args){return new Promise((resolve,reject)=>execFile(helper,args,{windowsHide:true,timeout:10000},(e,out,err)=>e?reject(Error(err.trim()||'Helper check failed')):resolve(out)))}\napp.whenReady().then(()=>{if(![helper,root,work].every(p=>p&&path.isAbsolute(p)))throw Error('Absolute helper, Buddy and transaction paths required');win=new BrowserWindow({width:840,height:830,autoHideMenuBar:true,webPreferences:{preload:path.join(__dirname,'recovery-preload.cjs'),contextIsolation:true,nodeIntegration:false,sandbox:true}});ipcMain.handle('preview',async event=>{if(event.sender!==win.webContents)throw Error('Invalid window');const j=JSON.parse(await run(['-inspect-recovery','-root',root,'-work',work]));reviewed=j.Session;return{root,session:j.Session,phase:j.Phase}});ipcMain.handle('restore',async(event,session)=>{if(event.sender!==win.webContents||!reviewed||session!==reviewed)throw Error('Review required');await run(['-recover','-root',root,'-work',work,'-approved-session',session]);reviewed=null});ipcMain.on('cancel',event=>{if(event.sender===win.webContents)win.close()});win.loadFile(path.join(__dirname,'recovery.html'))});app.on('window-all-closed',()=>app.quit());\n", encoding='utf-8')
