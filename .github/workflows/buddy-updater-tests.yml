d/v4.1.0/update.json\',path.join(work,\'update.json\'));\n // Integrate only the small health module into an isolated copy downloaded in CI.\n // The broader Buddy source is never committed or logged. Test key is ephemeral.\n const asar=await import(\'@electron/asar\');const unpack=path.join(process.cwd(),\'candidate-app\');asar.extractAll(path.join(work,\'next.asar\'),unpack);\n const mainFile=path.join(unpack,\'main.js\');let main=fs.readFileSync(mainFile,\'utf8\');const anchor="if(process.argv.includes(\'--update-health\'))panel.webContents.once";assert(main.includes(anchor),\'health integration anchor missing\');main=main.replace(anchor,"require(\'./session-health.cjs\').bindHealth(app,panel);"+anchor);fs.writeFileSync(mainFile,main);fs.copyFileSync(path.join(process.cwd(),\'session-health.cjs\'),path.join(unpack,\'session-health.cjs\'));fs.unlinkSync(path.join(work,\'next.asar\'));await asar.createPackage(unpack,path.join(work,\'next.asar\'));\n const keys=crypto.generateKeyPairSync(\'ed25519\');const der=keys.publicKey.export({type:\'spki\',format:\'der\'});const pub=\'-----BEGIN PUBLIC KEY-----\\n\'+der.toString(\'base64\')+\'\\n-----END PUBLIC KEY-----\\n\';const pemFile=path.join(process.cwd(),\'test-key-public.txt\');fs.writeFileSync(pemFile,pub);\n const payload=JSON.stringify({version:\'4.1.0\',sha256:crypto.createHash(\'sha256\').update(fs.readFileSync(path.join(work,\'next.asar\'))).digest(\'hex\'),bytes:fs.statSync(path.join(work,\'next.asar\')).size,url:\'https://github.com/malaamos12/spark-buddy-releases/releases/download/v4.1.0/app.asar\',kind:\'asar\',runtime:\'45.4.1\'});fs.writeFileSync(path.join(work,\'update.json\'),JSON.stringify({payload,signature:crypto.sign(null,Buffer.from(payload),keys.privateKey).toString(\'base64\')}));\n cp.execFileSync(\'go\',[\'build\',\'-ldflags\',\'-X main.testPublicKeyB64=\'+Buffer.from(pub).toString(\'base64\'),\'-o\',\'buddy-helper-test-key.exe\',\'./cmd/buddy-helper\'],{stdio:\'inherit\'});\n const {_electron}=require(\'playwright-core\');const old=await _electron.launch({executablePath:exe,args:[],cwd:root,env:{...process.env,SPARK_TEST_DATA:data},timeout:45000});assert.equal(await old.evaluate(({app})=>app.getVersion()),\'4.0.2\');const helper=path.join(process.cwd(),\'buddy-helper-test-key.exe\');\n const installModule=path.join(process.cwd(),\'session-install.cjs\');\n const cancelled=await old.evaluate(async({app},{module,helper,root,work})=>process.mainModule.require(module).installPrepared(app,{showMessageBox:async()=>({response:0})},{helper,root,work,current:\'4.0.2\'}),{module:installModule,helper,root,work});assert.equal(cancelled.status,\'cancelled\');assert.equal(await old.evaluate(({app})=>app.getVersion()),\'4.0.2\');\n console.log(\'PASS exact app install module cancel leaves Buddy running\');\n // Test dialog chooses approval, but exact app-side handshake and quit logic run.\n const installing=old.evaluate(async({app},{module,helper,root,work})=>process.mainModule.require(module).installPrepared(app,{showMessageBox:async()=>({response:1})},{helper,root,work,current:\'4.0.2\'}),{module:installModule,helper,root,work}).catch(e=>{console.log(\'install module result:\',e.message);return null});\n await wait(()=>fs.readdirSync(work).some(n=>/^ready-[a-f0-9]{48}$/.test(n))).catch(e=>{for(const n of fs.readdirSync(work)){if(n.endsWith(\'.log\')||n===\'active.json\')console.log(n,fs.readFileSync(path.join(work,n),\'utf8\'))}throw e});const session=fs.readdirSync(work).find(n=>n.startsWith(\'ready-\')).slice(6);await wait(()=>fs.existsSync(path.join(work,\'approve-\'+session)));await installing;\n const ack=path.join(data,\'updates\',\'healthy.txt\');console.log(\'App-side helper readiness/approval/quit completed; waiting health\');await wait(()=>fs.existsSync(ack)).catch(e=>{for(const n of fs.readdirSync(work)){if(n.endsWith(\'.log\')||n===\'active.json\')console.log(n,fs.readFileSync(path.join(work,n),\'utf8\'))}throw Error(\'actual health timeout\')});assert(fs