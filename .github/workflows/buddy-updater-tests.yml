          (root / 'recovery.html').write_text('<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Buddy recovery review</title><style>\nbody{margin:0;background:#111827;color:#e5e7eb;font:16px/1.55 system-ui,sans-serif}main{max-width:700px;margin:48px auto;padding:32px;background:#1f2937;border:1px solid #475569;border-radius:16px}h1{font-size:28px;line-height:1.2;margin:8px 0 24px}.tag{font-size:13px;color:#93c5fd}p{color:#cbd5e1}dl{background:#111827;border-radius:10px;padding:20px;overflow-wrap:anywhere}dt{font-size:13px;color:#94a3b8}dd{margin:2px 0 14px}button{padding:12px 18px;border-radius:8px;border:1px solid #64748b;background:#334155;color:white;font:600 15px system-ui;cursor:pointer}button:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:28px}#restore{background:#c2410c;border-color:#fb923c}.warn{border-left:3px solid #fbbf24;padding-left:16px}#status{min-height:24px;color:#fcd34d}\n</style><main><span class="tag">DEVELOPMENT PREVIEW · NOT A RELEASE</span><h1>Review interrupted Buddy update</h1><p>This restores only the previous app archive. It does not undo changes to tasks, settings or other app data.</p><dl><dt>Buddy folder</dt><dd id="root"></dd><dt>Transaction</dt><dd id="session"></dd><dt>Update stage</dt><dd id="phase"></dd></dl><p class="warn">Close Buddy before restoring. The helper checks the backup and current archive again. If anything changed or cannot be verified, it stops without replacing the archive.</p><p>No files are uploaded. Buddy will not reopen automatically. After a successful restore, open it yourself and check your data.</p><p id="status" role="status">Checking the interrupted transaction…</p><div class="actions"><button id="cancel" autofocus>Cancel</button><button id="restore" disabled>Restore previous archive</button></div></main><script>\nlet preview;\nasync function load(){try{preview=await window.recovery.preview();for(const k of [\'root\',\'session\',\'phase\'])document.getElementById(k).textContent=preview[k];document.getElementById(\'status\').textContent=\'Verified backup found. No archive has been changed.\';document.getElementById(\'restore\').disabled=false}catch(e){document.getElementById(\'status\').textContent=\'Recovery is unavailable: \'+e.message}}\ndocument.getElementById(\'cancel\').onclick=()=>window.recovery.cancel();document.getElementById(\'restore\').onclick=async()=>{document.getElementById(\'restore\').disabled=true;try{await window.recovery.restore(preview.session);document.getElementById(\'cancel\').textContent=\'Close\';document.getElementById(\'status\').textContent=\'Previous app archive restored. You can now close this window and open Buddy.\'}catch(e){document.getElementById(\'status\').textContent=\'Restore stopped: \'+e.message}};load();\n</script></html>\n', encoding='utf-8')
