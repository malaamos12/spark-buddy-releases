          (root / 'backup_windows_test.go').write_text('//go:build windows\n\npackage updater\n\nimport (\n\t"os"\n\t"path/filepath"\n\t"testing"\n)\n\nfunc TestCompleteOpaqueDataSnapshot(t *testing.T) {\n\tbase := t.TempDir()\n\tsrc := filepath.Join(base, "data")\n\tos.MkdirAll(filepath.Join(src, "Session Storage"), 0700)\n\tfor _, p := range []string{"state.json", "gemini-key.enc", "sidekick-key.enc", "Session Storage/opaque"} {\n\t\tos.WriteFile(filepath.Join(src, p), []byte("synthetic "+p), 0600)\n\t}\n\tdest := filepath.Join(base, "backup")\n\tm, e := Snapshot(src, dest)\n\tif e != nil {\n\t\tt.Fatal(e)\n\t}\n\tif len(m.Files) != 4 {\n\t\tt.Fatal("missing files")\n\t}\n\tos.WriteFile(filepath.Join(dest, "state.json"), []byte("changed"), 0600)\n\tif VerifySnapshot(dest, m) == nil {\n\t\tt.Fatal("corrupt snapshot accepted")\n\t}\n}\nfunc TestSnapshotRefusesNestedAndExisting(t *testing.T) {\n\tsrc := t.TempDir()\n\tif _, e := Snapshot(src, filepath.Join(src, "nested")); e == nil {\n\t\tt.Fatal("nested accepted")\n\t}\n\tdest := t.TempDir()\n\tif _, e := Snapshot(src, dest); e == nil {\n\t\tt.Fatal("existing accepted")\n\t}\n}\n', encoding='utf-8')
