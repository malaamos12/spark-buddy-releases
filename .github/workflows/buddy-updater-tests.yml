          (root / 'platform_windows.go').write_text('//go:build windows\n\npackage updater\n\nimport (\n\t"crypto/sha256"\n\t"encoding/csv"\n\t"errors"\n\t"fmt"\n\t"os"\n\t"os/exec"\n\t"path/filepath"\n\t"strconv"\n\t"strings"\n\t"syscall"\n\t"unsafe"\n)\n\nfunc sum256(b []byte) [32]byte { return sha256.Sum256(b) }\nfunc safePath(p string) error {\n\tp = filepath.Clean(p)\n\tif strings.HasPrefix(p, `\\\\`) {\n\t\treturn errors.New("network paths unsupported")\n\t}\n\tfor {\n\t\ts, e := os.Lstat(p)\n\t\tif e != nil {\n\t\t\treturn e\n\t\t}\n\t\td, ok := s.Sys().(*syscall.Win32FileAttributeData)\n\t\tif !ok || d.FileAttributes&syscall.FILE_ATTRIBUTE_REPARSE_POINT != 0 {\n\t\t\treturn errors.New("reparse path rejected")\n\t\t}\n\t\tparent := filepath.Dir(p)\n\t\tif parent == p {\n\t\t\tbreak\n\t\t}\n\t\tp = parent\n\t}\n\treturn nil\n}\n\nvar kernel = syscall.NewLazyDLL("kernel32.dll")\nvar queryPath = kernel.NewProc("QueryFullProcessImageNameW")\n\nfunc processInfo(pid int) (string, string, error) {\n\th, e := syscall.OpenProcess(0x1000, false, uint32(pid))\n\tif e != nil {\n\t\treturn "", "", e\n\t}\n\tdefer syscall.CloseHandle(h)\n\tvar created, exited, k, u syscall.Filetime\n\tif e = syscall.GetProcessTimes(h, &created, &exited, &k, &u); e != nil {\n\t\treturn "", "", e\n\t}\n\tif exited.HighDateTime != 0 || exited.LowDateTime != 0 {\n\t\treturn "", "", errors.New("process exited")\n\t}\n\tbuf := make([]uint16, 32768)\n\tn := uint32(len(buf))\n\tr, _, e := queryPath.Call(uintptr(h), 0, uintptr(unsafe.Pointer(&buf[0])), uintptr(unsafe.Pointer(&n)))\n\tif r == 0 {\n\t\treturn "", "", e\n\t}\n\treturn fmt.Sprintf("%d:%d", created.HighDateTime, created.LowDateTime), syscall.UTF16ToString(buf[:n]), nil\n}\nfunc Identity(pid int) (string, error) { i, _, e := processInfo(pid); return i, e }\nfunc matchingProcess(pid int, identity, exe string) error {\n\ti, p, e := processInfo(pid)\n\tif e != nil {\n\t\treturn e\n\t}\n\texpected, e := os.Stat(exe)\n\tif e != nil {\n\t\treturn e\n\t}\n\tactual, e := os.Stat(p)\n\tif e != nil {\n\t\treturn e\n\t}\n\tif i != identity || !os.SameFile(actual, expected) {\n\t\treturn errors.New("old process identity/path mismatch")\n\t}\n\treturn nil\n}\nfunc processAlive(pid int, identity string) bool {\n\ti, _, e := processInfo(pid)\n\treturn e == nil && i == identity\n}\n\nfunc transactionLock(p string) (func(), error) {\n\tif _, e := os.Lstat(p); e == nil {\n\t\tif e = regular(p); e != nil {\n\t\t\treturn nil, e\n\t\t}\n\t} else if !os.IsNotExist(e) {\n\t\treturn nil, e\n\t}\n\tptr, e := syscall.UTF16PtrFromString(p)\n\tif e != nil {\n\t\treturn nil, e\n\t}\n\th, e := syscall.CreateFile(ptr, syscall.GENERIC_READ|syscall.GENERIC_WRITE, 0, nil, syscall.OPEN_ALWAYS, syscall.FILE_ATTRIBUTE_NORMAL, 0)\n\tif e != nil {\n\t\treturn nil, errors.New("transaction lock busy or inaccessible")\n\t}\n\treturn func() { syscall.CloseHandle(h) }, nil\n}\nfunc noBuddyProcesses(exe string) error {\n\ttarget, e := os.Stat(exe)\n\tif e != nil {\n\t\treturn e\n\t}\n\tsnap, e := syscall.CreateToolhelp32Snapshot(syscall.TH32CS_SNAPPROCESS, 0)\n\tif e != nil {\n\t\treturn e\n\t}\n\tdefer syscall.CloseHandle(snap)\n\tvar entry syscall.ProcessEntry32\n\tentry.Size = uint32(unsafe.Sizeof(entry))\n\te = syscall.Process32First(snap, &entry)\n\tfor e == nil {\n\t\tif strings.EqualFold(syscall.UTF16ToString(entry.ExeFile[:]), "Spark Buddy.exe") {\n\t\t\t_, p, readErr := processInfo(int(entry.ProcessID))\n\t\t\tif readErr != nil {\n\t\t\t\treturn errors.New("cannot verify Buddy process; recovery refused")\n\t\t\t}\n\t\t\ts, readErr := os.Stat(p)\n\t\t\tif readErr != nil {\n\t\t\t\treturn readErr\n\t\t\t}\n\t\t\tif os.SameFile(target, s) {\n\t\t\t\treturn errors.New("Buddy still running; recovery refused")\n\t\t\t}\n\t\t}\n\t\te = syscall.Process32Next(snap, &entry)\n\t}\n\tif e != syscall.ERROR_NO_MORE_FILES {\n\t\treturn e\n\t}\n\treturn nil\n}\n\n// Restrict backups to current Windows identity. No inherited broad ACLs.\nfunc restrictedDirectory(p string) error {\n\tif e := os.Mkdir(p, 0700); e != nil {\n\t\treturn e\n\t}\n\tout, e := exec.Command("whoami.exe", "/user", "/fo", "csv", "/nh").Output()\n\tif e != nil {\n\t\treturn e\n\t}\n\tr, e := csv.NewReader(strings.NewReader(strings.TrimSpace(string(out)))).Read()\n\tif e != nil || len(r) != 2 || !strings.HasPrefix(r[1], "S-1-") {\n\t\treturn errors.New("cannot identify backup owner")\n\t}\n\t// Replace entire DACL instead of retaining explicit parent-created entries.\n\tsddl, e := syscall.UTF16PtrFromString("D:P(A;OICI;FA;;;" + r[1] + ")")\n\tif e != nil {\n\t\treturn e\n\t}\n\tadv := syscall.NewLazyDLL("advapi32.dll")\n\tvar sd uintptr\n\tok, _, callErr := adv.NewProc("ConvertStringSecurityDescriptorToSecurityDescriptorW").Call(uintptr(unsafe.Pointer(sddl)), 1, uintptr(unsafe.Pointer(&sd)), 0)\n\tif ok == 0 {\n\t\treturn callErr\n\t}\n\tdefer kernel.NewProc("LocalFree").Call(sd)\n\ttarget, e := syscall.UTF16PtrFromString(p)\n\tif e != nil {\n\t\treturn e\n\t}\n\tok, _, callErr = adv.NewProc("SetFileSecurityW").Call(uintptr(unsafe.Pointer(target)), 0x80000004, sd)\n\tif ok == 0 {\n\t\treturn callErr\n\t}\n\n\treturn nil\n}\nfunc availableSpace(data string, extra int64) error { return availableSpaceOn(data, data, extra) }\nfunc availableSpaceOn(data, target string, extra int64) error {\n\tvar bytes int64\n\te := filepath.WalkDir(data, func(p string, d os.DirEntry, e error) error {\n\t\tif e != nil {\n\t\t\treturn e\n\t\t}\n\t\tif e = safePath(p); e != nil {\n\t\t\treturn e\n\t\t}\n\t\tif !d.IsDir() {\n\t\t\ts, e := os.Stat(p)\n\t\t\tif e != nil {\n\t\t\t\treturn e\n\t\t\t}\n\t\t\tbytes += s.Size()\n\t\t}\n\t\treturn nil\n\t})\n\tif e != nil {\n\t\treturn e\n\t}\n\troot, e := syscall.UTF16PtrFromString(filepath.VolumeName(target) + `\\`)\n\tif e != nil {\n\t\treturn e\n\t}\n\tvar free, total, available uint64\n\tproc := kernel.NewProc("GetDiskFreeSpaceExW")\n\tr, _, e := proc.Call(uintptr(unsafe.Pointer(root)), uintptr(unsafe.Pointer(&available)), uintptr(unsafe.Pointer(&total)), uintptr(unsafe.Pointer(&free)))\n\tif r == 0 {\n\t\treturn e\n\t}\n\tif available < uint64(bytes*3+extra+64*1024*1024) {\n\t\treturn errors.New("not enough free disk space for data backup and rollback")\n\t}\n\treturn nil\n}\nfunc stopOwnedProcess(cmd *exec.Cmd) error {\n\tif cmd.Process == nil {\n\t\treturn errors.New("no owned app process")\n\t}\n\tout, e := exec.Command("taskkill.exe", "/PID", strconv.Itoa(cmd.Process.Pid), "/T", "/F").CombinedOutput()\n\tif e != nil {\n\t\treturn fmt.Errorf("could not stop new Buddy process tree (%d bytes)", len(out))\n\t}\n\treturn nil\n}\n\nvar allowFixtureRuntime bool\n\nfunc validateRuntime(exe string) error {\n\tif allowFixtureRuntime {\n\t\treturn nil\n\t}\n\tif e := regular(exe); e != nil {\n\t\treturn e\n\t}\n\th, e := hashFile(exe)\n\tif e != nil {\n\t\treturn e\n\t}\n\tif h != "a547b53fbee4dd4adca1a88e215270d06f7cb1e7d333ee402fb3dd677392a87a" && h != "9da3d31ec65f760b7706a1324306547b315a8d3c85b31eff987276e7ec5e6448" {\n\t\treturn errors.New("unsupported runtime executable; no repair performed")\n\t}\n\treturn nil\n}\n', encoding='utf-8')
