          (root / 'engine.go').write_text('// Candidate engine. Development only until complete integration validation.\npackage updater\n\nimport (\n\t"crypto/ed25519"\n\t"crypto/rand"\n\t"encoding/hex"\n\t"encoding/json"\n\t"errors"\n\t"fmt"\n\t"os"\n\t"os/exec"\n\t"path/filepath"\n\t"strings"\n\t"time"\n)\n\ntype Config struct {\n\tRoot, Work                string\n\tOldPID                    int\n\tOldIdentity               string\n\tSession, Current, Runtime string\n\tTimeout                   time.Duration\n}\ntype Journal struct{ Session, Phase, OldHash, NewHash string }\n\nfunc Token() string {\n\tb := make([]byte, 24)\n\tif _, e := rand.Read(b); e != nil {\n\t\tpanic(e)\n\t}\n\treturn hex.EncodeToString(b)\n}\nfunc regular(p string) error {\n\ts, e := os.Lstat(p)\n\tif e != nil {\n\t\treturn e\n\t}\n\tif !s.Mode().IsRegular() {\n\t\treturn errors.New("not regular")\n\t}\n\treturn safePath(p)\n}\nfunc atomic(p string, v any) error {\n\tb, e := json.Marshal(v)\n\tif e != nil {\n\t\treturn e\n\t}\n\tf, e := os.OpenFile(p+".new", os.O_CREATE|os.O_EXCL|os.O_WRONLY, 0600)\n\tif e != nil {\n\t\treturn e\n\t}\n\tdefer os.Remove(p + ".new")\n\tif _, e = f.Write(b); e == nil {\n\t\te = f.Sync()\n\t}\n\tc := f.Close()\n\tif e != nil {\n\t\treturn e\n\t}\n\tif c != nil {\n\t\treturn c\n\t}\n\treturn os.Rename(p+".new", p)\n}\nfunc hashFile(p string) (string, error) {\n\tb, e := os.ReadFile(p)\n\tif e != nil {\n\t\treturn "", e\n\t}\n\tsum := sha(b)\n\treturn sum, nil\n}\nfunc sha(b []byte) string { return fmt.Sprintf("%x", sum256(b)) }\n\n// Recover refuses ambiguous states, preserving every archive and journal.\nfunc Recover(root, work string) error {\n\tif e := safePath(root); e != nil {\n\t\treturn e\n\t}\n\tif e := safePath(work); e != nil {\n\t\treturn e\n\t}\n\tp := filepath.Join(work, "active.json")\n\tif e := regular(p); e != nil {\n\t\treturn e\n\t}\n\tb, e := os.ReadFile(p)\n\tif e != nil {\n\t\treturn e\n\t}\n\tvar j Journal\n\tif json.Unmarshal(b, &j) != nil || !validToken(j.Session) {\n\t\treturn errors.New("invalid journal")\n\t}\n\tlive := filepath.Join(root, "resources", "app.asar")\n\tbackup := filepath.Join(root, "resources", "app.asar.backup-"+j.Session)\n\tif e := regular(backup); e != nil {\n\t\treturn e\n\t}\n\tif _, e := os.Lstat(live); e == nil {\n\t\tif e = regular(live); e != nil {\n\t\t\treturn e\n\t\t}\n\t} else if !os.IsNotExist(e) {\n\t\treturn e\n\t}\n\tswitch j.Phase {\n\tcase "prepared", "backing-up", "installing", "launching", "rolling-back", "rolled-back", "healthy":\n\tdefault:\n\t\treturn errors.New("unknown journal phase")\n\t}\n\tcurrent, _ := hashFile(live)\n\told, e := hashFile(backup)\n\tif current == j.OldHash {\n\t\treturn errors.New("old archive present; explicit review required before clearing journal")\n\t}\n\tif e != nil || old != j.OldHash {\n\t\treturn errors.New("recovery source missing or changed; journal retained")\n\t}\n\tif j.Phase == "healthy" {\n\t\treturn errors.New("healthy transaction retained; no rollback without review")\n\t}\n\tif current != "" && current != j.NewHash {\n\t\treturn errors.New("unknown live archive; no automatic recovery")\n\t}\n\tif current != "" {\n\t\tif e = os.Rename(live, filepath.Join(root, "resources", "app.asar.failed-"+j.Session)); e != nil {\n\t\t\treturn e\n\t\t}\n\t}\n\tif e = os.Rename(backup, live); e != nil {\n\t\treturn e\n\t}\n\tj.Phase = "rolled-back"\n\treturn atomic(p, j)\n}\nfunc validToken(t string) bool { b, e := hex.DecodeString(t); return e == nil && len(b) == 24 }\nfunc RunCandidate(c Config, key ed25519.PublicKey) error {\n\tif !validToken(c.Session) || c.OldPID <= 0 || c.OldIdentity == "" {\n\t\treturn errors.New("invalid session")\n\t}\n\tif c.Timeout < time.Second || c.Timeout > 2*time.Minute {\n\t\treturn errors.New("invalid timeout")\n\t}\n\tfor _, p := range []string{c.Root, c.Work} {\n\t\tif !filepath.IsAbs(p) {\n\t\t\treturn errors.New("absolute paths required")\n\t\t}\n\t\tif e := safePath(p); e != nil {\n\t\t\treturn e\n\t\t}\n\t}\n\tlive := filepath.Join(c.Root, "resources", "app.asar")\n\tstage := filepath.Join(c.Work, "next.asar")\n\texe := filepath.Join(c.Root, "Spark Buddy.exe")\n\tmanifest := filepath.Join(c.Work, "update.json")\n\tjournal := filepath.Join(c.Work, "active.json")\n\tbackup := live + ".backup-" + c.Session\n\tfailed := live + ".failed-" + c.Session\n\tfor _, p := range []string{live, stage, exe, manifest} {\n\t\tif e := regular(p); e != nil {\n\t\t\treturn e\n\t\t}\n\t}\n\tif _, e := os.Lstat(journal); !os.IsNotExist(e) {\n\t\treturn errors.New("existing transaction requires recovery review")\n\t}\n\tfor _, p := range []string{backup, failed, journal + ".new", filepath.Join(c.Work, "ready-"+c.Session), filepath.Join(c.Work, "approve-"+c.Session), filepath.Join(c.Work, "health-"+c.Session)} {\n\t\tif _, e := os.Lstat(p); !os.IsNotExist(e) {\n\t\t\treturn errors.New("session collision")\n\t\t}\n\t}\n\tlock, e := os.OpenFile(filepath.Join(c.Work, "helper.lock"), os.O_CREATE|os.O_EXCL|os.O_WRONLY, 0600)\n\tif e != nil {\n\t\treturn errors.New("another helper or interrupted lock exists")\n\t}\n\tlock.Close()\n\tdefer os.Remove(filepath.Join(c.Work, "helper.lock"))\n\tlog, e := os.OpenFile(filepath.Join(c.Work, "helper-"+c.Session+".log"), os.O_CREATE|os.O_EXCL|os.O_WRONLY, 0600)\n\tif e != nil {\n\t\treturn e\n\t}\n\tdefer log.Close()\n\tnote := func(s string) error {\n\t\tif _, e := fmt.Fprintln(log, s); e != nil {\n\t\t\treturn e\n\t\t}\n\t\treturn log.Sync()\n\t}\n\tif e = note("preflight"); e != nil {\n\t\treturn e\n\t}\n\traw, e := os.ReadFile(manifest)\n\tif e != nil {\n\t\treturn e\n\t}\n\tdata, e := os.ReadFile(stage)\n\tif e != nil {\n\t\treturn e\n\t}\n\tm, e := Verify(raw, data, key, c.Current, c.Runtime)\n\tif e != nil {\n\t\treturn e\n\t}\n\toldHash, e := hashFile(live)\n\tif e != nil {\n\t\treturn e\n\t}\n\tif e = matchingProcess(c.OldPID, c.OldIdentity, exe); e != nil {\n\t\treturn e\n\t}\n\tj := Journal{c.Session, "prepared", oldHash, m.SHA256}\n\tif e = atomic(journal, j); e != nil {\n\t\treturn e\n\t}\n\tif e = atomic(filepath.Join(c.Work, "ready-"+c.Session), map[string]string{"session": c.Session}); e != nil {\n\t\treturn e\n\t}\n\tif e = note("ready; waiting for app approval"); e != nil {\n\t\treturn e\n\t}\n\tdeadline := time.Now().Add(c.Timeout)\n\tapproved := false\n\tfor time.Now().Before(deadline) {\n\t\tb, e := os.ReadFile(filepath.Join(c.Work, "approve-"+c.Session))\n\t\tif e == nil && strings.TrimSpace(string(b)) == c.Session {\n\t\t\tapproved = true\n\t\t\tbreak\n\t\t}\n\t\ttime.Sleep(50 * time.Millisecond)\n\t}\n\tif !approved {\n\t\treturn errors.New("approval timeout; archive untouched")\n\t}\n\tfor processAlive(c.OldPID, c.OldIdentity) && time.Now().Before(deadline) {\n\t\ttime.Sleep(50 * time.Millisecond)\n\t}\n\tif processAlive(c.OldPID, c.OldIdentity) {\n\t\treturn errors.New("old process timeout; archive untouched")\n\t}\n\t// Reverify input bytes and live immediately before mutation.\n\tnow, e := hashFile(live)\n\tif e != nil || now != oldHash {\n\t\treturn errors.New("live changed after preflight")\n\t}\n\tnow, e = hashFile(stage)\n\tif e != nil || now != m.SHA256 {\n\t\treturn errors.New("stage changed after preflight")\n\t}\n\tj.Phase = "backing-up"\n\tif e = atomic(journal, j); e != nil {\n\t\treturn e\n\t}\n\tif e = renameRetry(live, backup, c.Timeout); e != nil {\n\t\treturn e\n\t}\n\trollback := func(cause error) error {\n\t\tj.Phase = "rolling-back"\n\t\tif e := atomic(journal, j); e != nil {\n\t\t\treturn fmt.Errorf("%v; rollback journal failed", cause)\n\t\t}\n\t\tif _, e := os.Lstat(live); e == nil {\n\t\t\th, e := hashFile(live)\n\t\t\tif e != nil || h != m.SHA256 {\n\t\t\t\treturn errors.New("rollback refuses changed live archive")\n\t\t\t}\n\t\t\tif e = renameRetry(live, failed, c.Timeout); e != nil {\n\t\t\t\treturn fmt.Errorf("%v; failed archive could not be preserved", cause)\n\t\t\t}\n\t\t}\n\t\th, e := hashFile(backup)\n\t\tif e != nil || h != oldHash {\n\t\t\treturn errors.New("rollback source changed")\n\t\t}\n\t\tif e = renameRetry(backup, live, c.Timeout); e != nil {\n\t\t\treturn fmt.Errorf("%v; restore failed", cause)\n\t\t}\n\t\tj.Phase = "rolled-back"\n\t\t_ = atomic(journal, j)\n\t\t_ = note("rolled back; original archive restored")\n\t\treturn cause\n\t}\n\tj.Phase = "installing"\n\tif e = atomic(journal, j); e != nil {\n\t\treturn rollback(e)\n\t}\n\tif e = renameRetry(stage, live, c.Timeout); e != nil {\n\t\treturn rollback(e)\n\t}\n\tj.Phase = "launching"\n\tif e = atomic(journal, j); e != nil {\n\t\treturn rollback(e)\n\t}\n\tcmd := exec.Command(exe, "--update-health")\n\tcmd.Dir = c.Root\n\tcmd.Env = append(os.Environ(), "BUDDY_UPDATE_SESSION="+c.Session, "BUDDY_UPDATE_WORK="+c.Work)\n\tif e = cmd.Start(); e != nil {\n\t\treturn rollback(e)\n\t}\n\tdone := make(chan error, 1)\n\tgo func() { done <- cmd.Wait() }()\n\ttimer := time.NewTimer(c.Timeout)\n\tdefer timer.Stop()\n\ttick := time.NewTicker(50 * time.Millisecond)\n\tdefer tick.Stop()\n\tfor {\n\t\tselect {\n\t\tcase <-done:\n\t\t\treturn rollback(errors.New("new app exited before health"))\n\t\tcase <-timer.C:\n\t\t\t_ = cmd.Process.Kill()\n\t\t\t<-done\n\t\t\treturn rollback(errors.New("startup health timeout"))\n\t\tcase <-tick.C:\n\t\t\tb, e := os.ReadFile(filepath.Join(c.Work, "health-"+c.Session))\n\t\t\tif e == nil && string(b) == c.Session+" "+m.Version {\n\t\t\t\tj.Phase = "healthy"\n\t\t\t\tif e = atomic(journal, j); e != nil {\n\t\t\t\t\t_ = cmd.Process.Kill()\n\t\t\t\t\t<-done\n\t\t\t\t\treturn rollback(e)\n\t\t\t\t}\n\t\t\t\t_ = note("healthy; backup retained")\n\t\t\t\treturn nil\n\t\t\t}\n\t\t}\n\t}\n}\nfunc renameRetry(a, b string, d time.Duration) error {\n\tend := time.Now().Add(d)\n\tvar e error\n\tfor {\n\t\tif _, e = os.Lstat(b); !os.IsNotExist(e) {\n\t\t\treturn errors.New("destination exists or cannot be checked")\n\t\t}\n\t\te = os.Rename(a, b)\n\t\tif e == nil {\n\t\t\treturn nil\n\t\t}\n\t\tif time.Now().After(end) {\n\t\t\treturn e\n\t\t}\n\t\ttime.Sleep(50 * time.Millisecond)\n\t}\n}\n', encoding='utf-8')
