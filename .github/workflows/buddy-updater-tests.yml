          (root / 'bootstrap_recovery.go').write_text('package updater\n\nimport (\n\t"encoding/json"\n\t"errors"\n\t"os"\n\t"path/filepath"\n\t"time"\n)\n\n// RecoverBootstrap resumes only a reviewed candidate transaction with known build hashes.\n// It never clears, deletes or overwrites unknown archives/data. Buddy must already be stopped.\nfunc RecoverBootstrap(c BootstrapConfig, work string) error {\n\tif !validToken(c.Session) || !filepath.IsAbs(work) {\n\t\treturn errors.New("reviewed session required")\n\t}\n\tfor _, p := range []string{work, c.Root, filepath.Dir(c.Data)} {\n\t\tif e := safePath(p); e != nil {\n\t\t\treturn e\n\t\t}\n\t}\n\tp := filepath.Join(work, "bootstrap.json")\n\tif e := regular(p); e != nil {\n\t\treturn e\n\t}\n\tif _, e := os.Lstat(p + ".new"); !os.IsNotExist(e) {\n\t\treturn errors.New("partial journal needs review")\n\t}\n\traw, e := os.ReadFile(p)\n\tif e != nil {\n\t\treturn e\n\t}\n\tvar j map[string]string\n\tif json.Unmarshal(raw, &j) != nil || j["session"] != c.Session || j["root"] != c.Root || j["data"] != c.Data || j["oldHash"] != c.OldHash || j["newHash"] != c.NewHash {\n\t\treturn errors.New("recovery identity mismatch")\n\t}\n\tif j["phase"] == "healthy" {\n\t\treturn errors.New("healthy install cannot be rolled back by interruption recovery")\n\t}\n\tswitch j["phase"] {\n\tcase "backing-up-archive", "installing", "launching", "restoring", "rolled-back":\n\tdefault:\n\t\treturn errors.New("unknown bootstrap phase")\n\t}\n\texe := filepath.Join(c.Root, "Spark Buddy.exe")\n\tif e = noBuddyProcesses(exe); e != nil {\n\t\treturn e\n\t}\n\tunlock, e := transactionLock(filepath.Join(c.Root, "resources", "buddy-repair.lock"))\n\tif e != nil {\n\t\treturn e\n\t}\n\tdefer unlock()\n\tvar m SnapshotManifest\n\tmanifest := filepath.Join(work, "snapshot.json")\n\tif e = regular(manifest); e != nil {\n\t\treturn e\n\t}\n\traw, e = os.ReadFile(manifest)\n\tif e != nil || json.Unmarshal(raw, &m) != nil {\n\t\treturn errors.New("invalid data snapshot manifest")\n\t}\n\tsnapshot := filepath.Join(work, "data-before")\n\tif e = VerifySnapshot(snapshot, m); e != nil {\n\t\treturn e\n\t}\n\tlive := filepath.Join(c.Root, "resources", "app.asar")\n\tarchiveBackup := live + ".backup-" + c.Session\n\tarchiveFailed := live + ".failed-" + c.Session\n\tfailedData := c.Data + ".failed-" + c.Session\n\trestored := c.Data + ".restore-" + c.Session\n\texists := func(p string) bool { _, e := os.Lstat(p); return e == nil }\n\tcheckHash := func(p, want string) error {\n\t\tif e := regular(p); e != nil {\n\t\t\treturn e\n\t\t}\n\t\th, e := hashFile(p)\n\t\tif e != nil || h != want {\n\t\t\treturn errors.New("recovery archive hash mismatch")\n\t\t}\n\t\treturn nil\n\t}\n\tliveOld := false\n\tif exists(live) {\n\t\tif e = regular(live); e != nil {\n\t\t\treturn e\n\t\t}\n\t\th, e := hashFile(live)\n\t\tif e != nil {\n\t\t\treturn e\n\t\t}\n\t\tif h == c.OldHash {\n\t\t\tliveOld = true\n\t\t} else if h != c.NewHash {\n\t\t\treturn errors.New("unknown live archive")\n\t\t}\n\t}\n\tif !liveOld {\n\t\tif e = checkHash(archiveBackup, c.OldHash); e != nil {\n\t\t\treturn e\n\t\t}\n\t}\n\t// No install rename happened. Data must still equal the pre-update snapshot.\n\tif liveOld && j["phase"] == "backing-up-archive" {\n\t\tif e = VerifySnapshot(c.Data, m); e != nil {\n\t\t\treturn e\n\t\t}\n\t\tif e = preserveBootstrapHelper(c.Root, c.Session, c.HelperHash); e != nil {\n\t\t\treturn e\n\t\t}\n\t\tj["phase"] = "rolled-back"\n\t\treturn atomic(p, j)\n\t}\n\tif !exists(failedData) {\n\t\tif e = safePath(c.Data); e != nil {\n\t\t\treturn e\n\t\t}\n\t} else {\n\t\tif e = safePath(failedData); e != nil {\n\t\t\treturn e\n\t\t}\n\t\tif exists(c.Data) {\n\t\t\tif e = VerifySnapshot(c.Data, m); e != nil {\n\t\t\t\treturn errors.New("data exists after interrupted restore but does not match backup")\n\t\t\t}\n\t\t}\n\t}\n\tif !exists(failedData) || !exists(c.Data) {\n\t\tif exists(restored) {\n\t\t\tif e = VerifySnapshot(restored, m); e != nil {\n\t\t\t\treturn errors.New("partial restore copy requires manual review")\n\t\t\t}\n\t\t} else {\n\t\t\tif _, e = Snapshot(snapshot, restored); e != nil {\n\t\t\t\treturn e\n\t\t\t}\n\t\t}\n\t}\n\tif e = noBuddyProcesses(exe); e != nil {\n\t\treturn e\n\t}\n\tj["phase"] = "restoring"\n\tif e = atomic(p, j); e != nil {\n\t\treturn e\n\t}\n\tif !exists(failedData) {\n\t\tif e = os.Rename(c.Data, failedData); e != nil {\n\t\t\treturn e\n\t\t}\n\t}\n\tif !exists(c.Data) {\n\t\tif e = os.Rename(restored, c.Data); e != nil {\n\t\t\treturn e\n\t\t}\n\t}\n\tif e = VerifySnapshot(c.Data, m); e != nil {\n\t\treturn e\n\t}\n\tif !liveOld {\n\t\tif exists(live) {\n\t\t\tif exists(archiveFailed) {\n\t\t\t\treturn errors.New("failed archive collision requires review")\n\t\t\t}\n\t\t\tif e = renameRetry(live, archiveFailed, 5*time.Second); e != nil {\n\t\t\t\treturn e\n\t\t\t}\n\t\t}\n\t\tif e = renameRetry(archiveBackup, live, 5*time.Second); e != nil {\n\t\t\treturn e\n\t\t}\n\t}\n\tif e = preserveBootstrapHelper(c.Root, c.Session, c.HelperHash); e != nil {\n\t\treturn e\n\t}\n\tj["phase"] = "rolled-back"\n\treturn atomic(p, j)\n}\n\nfunc preserveBootstrapHelper(root, session, expected string) error {\n\tp := filepath.Join(root, "buddy-updater-helper.exe")\n\tif _, e := os.Lstat(p); os.IsNotExist(e) {\n\t\treturn nil\n\t}\n\tif e := regular(p); e != nil {\n\t\treturn e\n\t}\n\th, e := hashFile(p)\n\tif e != nil || h != expected {\n\t\treturn errors.New("helper changed; recovery paused")\n\t}\n\treturn os.Rename(p, p+".failed-"+session)\n}\n', encoding='utf-8')
